name: Test WordPress (throwaway install)

# There is no staging: a PHP fatal in the plugin or theme takes the live site
# down. Every PR touching wordpress/** runs the plugin and theme on a fresh
# WordPress (MySQL service + wp server), creates sample content (the Esquina
# script, an interview, an outfitter), renders the main pages and sends an
# inquiry through the real form. Fails on any PHP warning or fatal.

on:
  pull_request:
    paths: ['wordpress/**', '.github/workflows/test-wp.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP: /tmp/wp
      URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - name: Brand rules (docs/marca.md)
        run: node wordpress/build/revisar-marca.mjs
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, gd, mbstring
          tools: wp-cli
      - name: Install WordPress + SCF + plugin + theme
        run: |
          w() { wp --path="$WP" "$@"; }
          mkdir -p "$WP"
          w core download --locale=es_AR --quiet
          w config create --dbname=wp --dbuser=root --dbpass=root --dbhost=127.0.0.1 --quiet
          w config set WP_DEBUG true --raw
          w config set WP_DEBUG_LOG true --raw
          w config set WP_DEBUG_DISPLAY false --raw
          w core install --url="$URL" --title=Pescamapa --admin_user=admin --admin_password=admin --admin_email=test@example.com --skip-email --quiet
          w plugin install secure-custom-fields --activate --quiet
          cp -r wordpress/plugins/pescamapa-core "$WP/wp-content/plugins/"
          cp -r wordpress/themes/pescamapa "$WP/wp-content/themes/"
          echo "test" > "$WP/wp-content/themes/pescamapa/build.txt"
          w plugin activate pescamapa-core
          w theme activate pescamapa
          w option update permalink_structure '/%postname%/'
          w eval 'flush_rewrite_rules( false );'
      - name: Sample content
        run: |
          w() { wp --path="$WP" "$@"; }
          for e in dorado:Dorado surubi:Surubí; do
            id=$(w post create --post_type=pm_especie --post_status=publish --post_title="${e#*:}" --porcelain)
            w eval "update_field( 'idioma', 'es', $id ); update_field( 'clave', '${e%%:*}', $id );"
          done
          w eval-file wordpress/scripts/esquina-2026-10-20.php
          w eval-file wordpress/scripts/esquina-2026-10-20.php   # idempotent: second run does nothing
          w eval-file wordpress/scripts/esquina-reglamento-2026-10-20.php
          w eval-file wordpress/scripts/flycast-2026-10-21.php
          w eval-file wordpress/scripts/flycast-2026-10-21.php   # idempotent
          w eval-file wordpress/scripts/paso-de-la-patria-2026-10-21.php
          w eval-file wordpress/scripts/paso-de-la-patria-2026-10-21.php   # idempotent
          w eval-file wordpress/scripts/prestadores-2026-10-20.php
          w eval-file wordpress/scripts/prestadores-2026-10-20.php   # idempotent
          sed 's/^\$aplicar = false;/$aplicar = true;/' wordpress/scripts/ogaraity-2026-10-24.php > /tmp/ogaraity.php
          w eval-file /tmp/ogaraity.php
          w eval-file /tmp/ogaraity.php   # idempotent
          [[ "$(w post list --post_type=pm_prestador --title='Apart Ogaraity Hotel' --format=count)" == 1 ]] || { echo '✖ Ogaraity no se creó una sola vez'; exit 1; }
          sed 's/^\$aplicar = false;/$aplicar = true;/' wordpress/scripts/experiencia-isoro-2026-10-24.php > /tmp/isoro.php
          w eval-file /tmp/isoro.php
          w eval-file /tmp/isoro.php   # idempotent: updates the same record
          [[ "$(w post list --post_type=pm_prestador --title='Experiencia Isoró' --format=count)" == 1 ]] || { echo '✖ Experiencia Isoró no quedó una sola vez'; exit 1; }
          [[ "$(w post list --post_type=pm_prestador --title='Agus — guía de pesca en Goya' --format=count)" == 0 ]] || { echo '✖ el ejemplo Agus sigue ahí'; exit 1; }
          sed 's/^\$aplicar = false;/$aplicar = true;/' wordpress/scripts/especies-dorado-surubi-2026-10-24.php > /tmp/especies.php
          w eval-file /tmp/especies.php
          w eval-file /tmp/especies.php   # idempotent
          # The script leaves Esquina as a draft; publish it here to render it.
          w post update $(w post list --post_type=pm_destino --post_status=draft --format=ids) --post_status=publish
          # The sizes-and-quotas FAQ only sees published guides (as on the server).
          w eval-file wordpress/scripts/reglas-corrientes-2026-10-21.php
          w eval-file wordpress/scripts/reglas-corrientes-2026-10-21.php   # idempotent
          w eval '
            $id = wp_insert_post( [ "post_type" => "pm_entrevista", "post_status" => "publish", "post_title" => "Prueba: el río manda", "post_name" => "prueba-el-rio-manda", "post_content" => "<!-- wp:paragraph --><p>Charla de prueba.</p><!-- /wp:paragraph -->" ] );
            foreach ( [ "idioma" => "es", "clave" => "prueba", "persona" => "Persona Prueba", "destino" => "esquina", "fecha" => "20261020", "consentimiento" => 1, "rol" => "Guía de prueba", "bajada" => "Bajada de prueba", "seo_title" => "Prueba", "seo_description" => "Descripción de prueba" ] as $k => $v ) { update_field( $k, $v, $id ); }
            update_field( "citas", [ [ "cita" => "CITA-DE-PRUEBA en Esquina", "tema" => "temporada" ] ], $id );
            $sin = wp_insert_post( [ "post_type" => "pm_entrevista", "post_status" => "publish", "post_title" => "Sin permiso", "post_name" => "sin-permiso" ] );
            foreach ( [ "idioma" => "es", "clave" => "sin-permiso", "persona" => "Otra", "destino" => "esquina", "fecha" => "20261020", "consentimiento" => 0, "rol" => "x" ] as $k => $v ) { update_field( $k, $v, $sin ); }
            update_field( "citas", [ [ "cita" => "CITA-SIN-PERMISO", "tema" => "consejo" ] ], $sin );
            $n = wp_insert_post( [ "post_type" => "pm_nota", "post_status" => "publish", "post_title" => "Nota de prueba: el río manda", "post_name" => "nota-de-prueba", "post_content" => "<!-- wp:paragraph --><p>Texto de la nota.</p><!-- /wp:paragraph --><!-- wp:quote --><blockquote class=\"wp-block-quote\"><p>Cita dentro del texto.</p></blockquote><!-- /wp:quote -->" ] );
            foreach ( [ "idioma" => "es", "clave" => "nota-prueba", "nota_tipo" => "datos", "nota_destino" => "esquina", "nota_fecha" => "20261021", "bajada" => "Bajada de la nota", "seo_title" => "Nota de prueba", "seo_description" => "Descripción de la nota de prueba" ] as $k => $v ) { update_field( $k, $v, $n ); }
            update_field( "nota_datos", [ [ "dato" => "DATO-CLAVE-DE-PRUEBA" ], [ "dato" => "PENDIENTE: dato sin confirmar" ] ], $n );
            update_field( "fuentes", [ [ "nombre" => "FUENTE-DE-PRUEBA", "url" => "https://example.com/fuente", "oficial" => 0, "consultada" => "20261021" ] ], $n );
            $esq = pm_buscar( "pm_destino", "esquina", "es" );
            update_field( "mas", [ [ "nombre" => "MAS-GRATIS", "url" => "https://example.com/a", "texto" => "Un paseo", "patrocinado" => 0 ], [ "nombre" => "MAS-PAGO", "url" => "https://example.com/b", "texto" => "Un aviso", "patrocinado" => 1 ] ], $esq->ID );
            $pub = wp_insert_post( [ "post_type" => "pm_prestador", "post_status" => "publish", "post_title" => "PRESTADOR-PUBLICO" ] );
            foreach ( [ "tipo" => [ "operador" ], "prest_destino" => "esquina", "prest_publico" => 1, "prest_fuente" => "https://example.com/prestador" ] as $k => $v ) { update_field( $k, $v, $pub ); }
            $ac = wp_insert_post( [ "post_type" => "pm_prestador", "post_status" => "publish", "post_title" => "PRESTADOR-CON-ACUERDO" ] );
            foreach ( [ "tipo" => [ "guia" ], "prest_destino" => "esquina", "prest_consentimiento" => 1, "estado" => "acuerdo", "prest_oferta" => "OFERTA-DE-PRUEBA", "prest_idiomas" => [ "pt", "en" ], "prest_accesible" => "si" ] as $k => $v ) { update_field( $k, $v, $ac ); }
            $sa = wp_insert_post( [ "post_type" => "pm_prestador", "post_status" => "publish", "post_title" => "PRESTADOR-SIN-ACUERDO" ] );
            foreach ( [ "tipo" => [ "guia" ], "prest_destino" => "esquina", "prest_consentimiento" => 1, "estado" => "contactado", "prest_oferta" => "OFERTA-NO-ACORDADA", "prest_accesible" => "no" ] as $k => $v ) { update_field( $k, $v, $sa ); }
            $no = wp_insert_post( [ "post_type" => "pm_prestador", "post_status" => "publish", "post_title" => "PRESTADOR-NO-PUBLICO" ] );
            foreach ( [ "tipo" => [ "guia" ], "prest_destino" => "esquina" ] as $k => $v ) { update_field( $k, $v, $no ); }
            $r = wp_insert_post( [ "post_type" => "pm_prestador", "post_status" => "publish", "post_title" => "PRESTADOR-DE-PRUEBA" ] );
            foreach ( [ "tipo" => [ "guia" ], "prest_destino" => "esquina", "prest_modalidades" => [ "mosca" ], "equipo" => [ "motor_electrico" ], "incluye" => [ "carnada", "comida" ], "precio" => "Desde $ 1", "precio_fecha" => "20261020", "prest_consentimiento" => 1, "whatsapp" => "CONTACTO-INTERNO-123" ] as $k => $v ) { update_field( $k, $v, $r ); }
          '
      - name: Render pages
        run: |
          wp --path="$WP" server --host=localhost --port=8080 > /tmp/server.log 2>&1 &
          sleep 3
          fail=0
          check() { # path status [must-contain] [must-not-contain]
            code=$(curl -sS -o page.html -w '%{http_code}' "$URL$1")
            if [[ "$code" != "$2" ]]; then echo "✖ $code $1 (esperado $2)"; fail=1; return; fi
            if [[ -n "${3:-}" ]] && ! grep -q -- "$3" page.html; then echo "✖ $1 no contiene: $3"; fail=1; return; fi
            if [[ -n "${4:-}" ]] && grep -q -- "$4" page.html; then echo "✖ $1 contiene: $4"; fail=1; return; fi
            echo "✓ $code $1"
          }
          check / 200 'PESCAMAPA'
          check /en/ 200 'lang="en"'
          check /mapa/ 200
          check /litoral/corrientes/pesca-en-esquina/ 200 'TouristDestination' 'PENDIENTE'
          check /litoral/corrientes/pesca-en-esquina/ 200 'CITA-DE-PRUEBA' 'CITA-SIN-PERMISO'
          check /litoral/corrientes/pesca-en-esquina/ 200 'PRESTADOR-DE-PRUEBA' 'CONTACTO-INTERNO-123'
          check /litoral/corrientes/pesca-en-esquina/ 200 'admin-post.php'
          # Public listing: shown, labelled unverified, with the removal link; no listing flag, no card.
          check /litoral/corrientes/pesca-en-esquina/ 200 'PRESTADOR-PUBLICO' 'PRESTADOR-NO-PUBLICO'
          check /litoral/corrientes/pesca-en-esquina/ 200 'mailto:info@pescamapa.com?subject='
          check /litoral/corrientes/pesca-en-esquina/ 200 'sin verificar con el prestador'
          check /litoral/corrientes/pesca-en-esquina/ 200 'Precio: a consultar'
          check /llms.txt 200 'se corrigen o se quitan a pedido' 'PRESTADOR-PUBLICO'
          # Special condition: only for an outfitter we work with.
          check /litoral/corrientes/pesca-en-esquina/ 200 'Con Pescamapa: OFERTA-DE-PRUEBA' 'OFERTA-NO-ACORDADA'
          check /llms.txt 200 'Prestadores con condición especial por Pescamapa'
          # Languages and accessibility on the card ("no" is never shown).
          check /litoral/corrientes/pesca-en-esquina/ 200 'Portugués · Inglés'
          check /litoral/corrientes/pesca-en-esquina/ 200 '♿ Ofrece servicio accesible'
          check / 200 'hero-map' 'Primera guía'
          check /llms.txt 200 'OFERTA-DE-PRUEBA' 'OFERTA-NO-ACORDADA'
          # Example-data outfitters never reach visitors.
          check /litoral/corrientes/pesca-en-esquina/ 200 'pacú' 'Don Joaquín River Lodge'
          check /entrevistas/ 200 'Persona Prueba' 'Sin permiso'
          check /en/interviews/ 200 'v-entrevistas'
          check /entrevistas/prueba-el-rio-manda/ 200 '"Article"'
          check /entrevistas/sin-permiso/ 404
          check /wp-sitemap.xml 200 'pm_entrevista'
          check / 200 'Dónde, cuándo y con quién pescar'
          check /litoral/corrientes/pesca-en-esquina/ 200 'Mosca (flycast)' 'flycast) (flycast'
          check /robots.txt 200 'Sitemap'
          check /llms.txt 200 'pesca-en-esquina'
          check /llms.txt 200 'prueba-el-rio-manda' 'sin-permiso'
          check /llms.txt 200 'nota-de-prueba'
          check /llms.txt 200 'pesca-en-paso-de-la-patria'
          # Third guide: rules from the official annex, no internal notes, outfitters labelled.
          check /litoral/corrientes/pesca-en-paso-de-la-patria/ 200 'Disposición 853/22' 'PENDIENTE'
          check /litoral/corrientes/pesca-en-paso-de-la-patria/ 200 'un solo ejemplar por embarcación'
          check /litoral/corrientes/pesca-en-paso-de-la-patria/ 200 'Posada del Paso'
          check /litoral/corrientes/pesca-en-paso-de-la-patria/ 200 'sin verificar con el prestador'
          check /litoral/corrientes/pesca-en-paso-de-la-patria/ 200 'TouristDestination'
          check /pt/litoral/corrientes/pesca-em-paso-de-la-patria/ 200 'Disposição 853/22' 'PENDIENTE'
          check /litoral/corrientes/pesca-en-esquina/ 200 '¿Qué tallas y cupos rigen en Corrientes?'
          check /litoral/corrientes/pesca-en-esquina/ 200 'Fuentes consultadas ('
          check /litoral/corrientes/pesca-en-esquina/ 200 '"citation"'
          check /litoral/corrientes/pesca-en-esquina/ 200 'rel="sponsored noopener"'
          check /litoral/corrientes/pesca-en-esquina/ 200 'MAS-GRATIS'
          check /notas/ 200 'Nota de prueba'
          check /en/notes/ 200 'v-notas'
          check /notas/nota-de-prueba/ 200 'DATO-CLAVE-DE-PRUEBA' 'dato sin confirmar'
          check /notas/nota-de-prueba/ 200 'FUENTE-DE-PRUEBA'
          check /notas/nota-de-prueba/ 200 '"citation"'
          check / 200 '/notas/'
          check /llms.txt 200 'Pescamapa es la guía' 'CONTACTO-INTERNO-123'
          # Inquiry through the real form (pm_t in the past: passes the timing check).
          loc=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' \
            -d action=pm_consulta -d pm_tipo=viaje -d pm_idioma=es -d pm_destino=esquina \
            -d pm_volver="$URL/litoral/corrientes/pesca-en-esquina/" -d pm_t=$(( $(date +%s) - 60 )) \
            -d nombre=Prueba -d contacto=+5493411234567 -d cuando=marzo -d personas=3 \
            "$URL/wp-admin/admin-post.php")
          [[ "$loc" == *"consulta=ok"* ]] && echo "✓ consulta → $loc" || { echo "✖ consulta: $loc"; fail=1; }
          # Honeypot: silently dropped.
          curl -sS -o /dev/null -d action=pm_consulta -d pm_web=spam -d pm_t=1 -d nombre=Bot -d contacto=bot "$URL/wp-admin/admin-post.php"
          n=$(wp --path="$WP" post list --post_type=pm_consulta --post_status=private --format=count)
          [[ "$n" == 1 ]] && echo "✓ 1 consulta guardada" || { echo "✖ consultas guardadas: $n (esperado 1)"; fail=1; }
          # Trip request page (/armar-viaje/): renders in 3 languages, preselects from the URL, saves the new fields as Spanish labels.
          check /armar-viaje/ 200 'Armá tu viaje de pesca a Argentina' 'PENDIENTE'
          check /armar-viaje/ 200 'name="contacto"'
          check '/armar-viaje/?destino=esquina&especie=dorado' 200 'value="esquina" selected'
          check /pt/planejar-viagem/ 200 'Monte sua viagem de pesca à Argentina'
          check /en/plan-your-trip/ 200 'Plan your fishing trip to Argentina'
          check /en/plan-your-trip/ 200 'hreflang="es"'
          check / 200 'href="[^"]*/armar-viaje/"'
          check /en/ 200 'plan-your-trip'
          check /llms.txt 200 'Armá tu viaje'
          check /wp-sitemap-vistas-1.xml 200 'armar-viaje'
          loc=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' \
            -d action=pm_consulta -d pm_tipo=viaje -d pm_idioma=en -d pm_destino=goya \
            -d pm_volver="$URL/en/plan-your-trip/" -d pm_t=$(( $(date +%s) - 60 )) \
            -d nombre=Tester -d contacto=tester@example.com -d cuando=November -d personas=2 \
            -d duracion=semana -d experiencia=alguna -d alojamiento=lodge -d pais=Chile -d modalidad=mosca \
            "$URL/wp-admin/admin-post.php")
          [[ "$loc" == *"consulta=ok"* ]] && echo "✓ viaje → $loc" || { echo "✖ viaje: $loc"; fail=1; }
          v=$(wp --path="$WP" post list --post_type=pm_consulta --post_status=private --s=Tester --format=ids | head -n1)
          for par in "duracion:5 a 7 días" "experiencia:Algo de experiencia" "alojamiento:Lodge con todo incluido" "pais:Chile"; do
            k=${par%%:*}; e=${par#*:}; g=$(wp --path="$WP" post meta get "$v" "$k")
            [[ "$g" == "$e" ]] && echo "✓ $k = $g" || { echo "✖ $k = '$g' (esperado '$e')"; fail=1; }
          done
          check '/en/plan-your-trip/?consulta=ok' 200 'Thank you, we got your request'
          # Species pages: real content, record with its source, the hidden note never shown.
          check /especies/dorado/ 200 'Récord mundial del dorado' 'PENDIENTE'
          check /especies/dorado/ 200 '25,28 kg'
          check /especies/dorado/ 200 'Fuentes consultadas'
          check /especies/dorado/ 200 'application/ld+json'
          check /especies/dorado/ 200 'Dorado: récord mundial, tamaño y reglas' 'Angler'
          check /especies/surubi/ 200 'solo pesca y devolución' 'PENDIENTE'
          # Long-form notes "when to fish" (dorado, surubí), 3 languages: created by the script, evergreen body + dated yearly box, SEO and JSON-LD.
          sed 's/^\$aplicar = false;/$aplicar = true;/' wordpress/scripts/notas-dorado-surubi-2026-10-26.php > /tmp/notas.php
          wp --path="$WP" eval-file /tmp/notas.php
          wp --path="$WP" eval-file /tmp/notas.php   # idempotent
          n=$(wp --path="$WP" post list --post_type=pm_nota --post_status=publish --meta_key=clave --meta_value=cuando-pescar-dorado --format=count)
          [[ "$n" == 3 ]] && echo "✓ nota del dorado en 3 idiomas" || { echo "✖ nota del dorado: $n (esperado 3)"; fail=1; }
          check /notas/cuando-pescar-dorado/ 200 'Al día · vedas y novedades' 'PENDIENTE'
          check /notas/cuando-pescar-dorado/ 200 'application/ld+json'
          check /notas/cuando-pescar-dorado/ 200 '"citation"'
          check /notas/cuando-pescar-dorado/ 200 'Cuándo pescar dorado: mejores meses y vedas | Pescamapa'
          check /notas/cuando-pescar-dorado/ 200 'Datos clave'
          check /notas/cuando-pescar-dorado/ 200 'rel="alternate" hreflang="en"'
          check /en/notes/best-time-to-fish-golden-dorado/ 200 'Up to date · closures and news'
          check /pt/notas/quando-pescar-dourado/ 200 'Em dia · vedas e novidades'
          check /notas/cuando-pescar-surubi/ 200 'Fiesta Nacional del Surubí, en Goya'
          check /en/notes/best-time-to-fish-surubi/ 200 'Best time to fish surubí in Argentina'
          check /pt/notas/quando-pescar-surubi/ 200 'Quando pescar surubi: melhores meses e vedas'
          check /notas/cuando-pescar-dorado/ 200 'href="[^"]*armar-viaje/?destino='
          check /notas/ 200 'Cuándo pescar el dorado'
          check /llms.txt 200 'Cuándo pescar el dorado'
          check /wp-sitemap-posts-pm_nota-1.xml 200 'cuando-pescar-dorado'
          # Zona de pique (docs/pique.md): empty state, report through the real endpoint, privacy, delay, abuse limits.
          check /pique/ 200 'pique-mapa' 'reportes en'
          check /pique/ 200 'Todavía no hay reportes'
          check /pique/ 200 'Mapa de destinos'
          check /pique/ 200 'data-destinos=.*Esquina' ''
          check /pt/pique/ 200 'Zonas de pesca'
          check /en/bite-zones/ 200 'Bite zones'
          check /wp-sitemap.xml 200 'wp-sitemap-vistas'
          check / 200 '/pique/'
          check /llms.txt 200 'Zonas de pique'
          pique() { # lat lon especie resultado → body
            curl -sS -d action=pm_pique -d pm_t=$(( $(date +%s) - 60 )) -d celda_lat="$1" -d celda_lon="$2" -d especie="$3" -d resultado="$4" -d dia=$(date +%Y%m%d) "$URL/wp-admin/admin-post.php"
          }
          r=$(pique -2784 -5812 dorado bueno)
          [[ "$r" == *'"ok":true'* ]] && echo "✓ reporte de pique guardado" || { echo "✖ reporte: $r"; fail=1; }
          r=$(pique -2784 -5812 dorado bueno)   # same sender, cell, species and day: counted once
          r=$(pique 0 0 dorado bueno)
          [[ "$r" == *'"ok":false'* ]] && echo "✓ celda fuera de la Argentina rechazada" || { echo "✖ celda inválida aceptada: $r"; fail=1; }
          r=$(pique -2784 -5812 ballena bueno)
          [[ "$r" == *'"ok":false'* ]] && echo "✓ especie inválida rechazada" || { echo "✖ especie inválida aceptada: $r"; fail=1; }
          curl -sS -o /dev/null -d action=pm_pique -d pm_web=spam -d pm_t=1 -d celda_lat=-2785 -d celda_lon=-5813 -d especie=surubi -d resultado=bueno -d dia=$(date +%Y%m%d) "$URL/wp-admin/admin-post.php"
          n=$(wp --path="$WP" post list --post_type=pm_reporte --post_status=private --format=count)
          [[ "$n" == 1 ]] && echo "✓ 1 reporte (duplicado, inválidos y bot descartados)" || { echo "✖ reportes guardados: $n (esperado 1)"; fail=1; }
          # Privacy: only the cell is stored, never a point; no name.
          keys=$(wp --path="$WP" eval '$id = get_posts( [ "post_type" => "pm_reporte", "post_status" => "private", "fields" => "ids" ] )[0]; echo implode( ",", array_keys( array_filter( get_post_meta( $id ), fn( $k ) => 0 !== strpos( $k, "_" ), ARRAY_FILTER_USE_KEY ) ) );')
          [[ "$keys" == "celda,celda_lat,celda_lon,especie,resultado,dia,huella" ]] && echo "✓ solo se guarda la celda ($keys)" || { echo "✖ campos guardados: $keys"; fail=1; }
          # The 48 h delay: a fresh report is not on the public page.
          check /pique/ 200 'Todavía no hay reportes'
          wp --path="$WP" eval '$id = get_posts( [ "post_type" => "pm_reporte", "post_status" => "private", "fields" => "ids" ] )[0]; wp_update_post( [ "ID" => $id, "post_date" => gmdate( "Y-m-d H:i:s", time() - 3 * DAY_IN_SECONDS ), "post_date_gmt" => gmdate( "Y-m-d H:i:s", time() - 3 * DAY_IN_SECONDS ), "edit_date" => true ] ); delete_transient( "pm_pique_celdas" );'
          check /pique/ 200 '1 reporte en 1 zona' 'Todavía no hay reportes'
          check /pique/ 200 '&quot;bueno&quot;:1' 'huella'
          # Hourly limit per sender.
          limite=0; for i in 1 2 3 4 5 6 7; do r=$(pique -2784 -5812 surubi regular); [[ "$r" == *limite* ]] && limite=1; done
          [[ "$limite" == 1 ]] && echo "✓ límite por hora" || { echo "✖ no hubo límite por hora"; fail=1; }
          if [[ -f "$WP/wp-content/debug.log" ]]; then
            echo "== debug.log"; cat "$WP/wp-content/debug.log"
            grep -qE 'PHP (Fatal|Warning|Parse)' "$WP/wp-content/debug.log" && { echo "✖ errores PHP"; fail=1; }
          fi
          exit $fail

      - name: Editor can replace a guide's photo and save (no blocking validation)
        run: |
          w() { wp --path="$WP" "$@"; }
          curl -s -o /dev/null "$URL/" || { wp --path="$WP" server --host=localhost --port=8080 > /tmp/server.log 2>&1 & sleep 3; }
          w user create cheyenne cheyenne@example.com --role=pescamapa_editor --user_pass=prueba-123 --quiet
          post=$(w post list --post_type=pm_destino --meta_key=clave --meta_value=esquina --format=ids)
          php -r '$i = imagecreatetruecolor( 1600, 1000 ); imagefill( $i, 0, 0, imagecolorallocate( $i, 30, 80, 60 ) ); imagejpeg( $i, "/tmp/nueva.jpg" );'
          foto=$(w media import /tmp/nueva.jpg --porcelain)
          dump() { w eval 'foreach ( [ "fuentes", "faqs", "aguas", "temporada" ] as $n ) { $c = get_post_meta( '"$post"', $n, true ); $v = get_post_meta( '"$post"', $n . "_0_" . ( "fuentes" === $n ? "nombre" : ( "faqs" === $n ? "pregunta" : ( "aguas" === $n ? "nombre" : "meses" ) ) ), true ); echo "$n: filas=" . var_export( $c, true ) . " primera=" . var_export( $v, true ) . "\n"; }'; }
          echo "== repetidores ANTES"; dump
          echo "== formulario en el servidor (admin vs editora)"; POST_ID="$post" w eval-file "$GITHUB_WORKSPACE/.github/scripts/formulario.php"
          fuente_antes=$(w post meta get "$post" fuentes_0_nombre || true)
          [[ -n "$fuente_antes" ]] || { echo "✖ la guía de prueba no tiene fuentes cargadas"; exit 1; }
          w eval "update_field( 'foto_autor', 'Tomás Prueba', $foto );"
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > editor.mjs <<'JS'
          import { chromium } from 'playwright';
          const [url, post, foto] = process.argv.slice(2);
          const b = await chromium.launch();
          const p = await b.newPage();
          await p.goto(`${url}/wp-login.php`);
          await p.fill('#user_login', 'cheyenne');
          await p.fill('#user_pass', 'prueba-123');
          await Promise.all([p.waitForNavigation(), p.click('#wp-submit')]);
          await p.goto(`${url}/wp-admin/post.php?post=${post}&action=edit`);
          await p.waitForFunction(() => window.wp?.data?.select('core/editor')?.getCurrentPostId());
          await p.evaluate((f) => {
            wp.data.dispatch('core/preferences')?.set('core/edit-post', 'welcomeGuide', false);
            wp.data.dispatch('core/editor').editPost({ featured_media: Number(f) });
          }, foto);
          const campos = await p.$$eval('[name^="acf[field_pm_d_fuentes]"]', (els) => els.slice(0, 10).map((e) => `${e.name}=${JSON.stringify(e.value)} type=${e.type} visible=${!!(e.offsetWidth || e.offsetHeight)}`));
          console.log('inputs de fuentes en el formulario:', campos.length, '\n' + campos.join('\n'));
          const otros = await p.$$eval('[name^="acf[field_pm_d_faqs]"]', (els) => els.slice(0, 3).map((e) => `${e.name}=${JSON.stringify(e.value).slice(0, 40)}`));
          console.log('inputs de faqs (comparación):\n' + otros.join('\n'));
          await p.keyboard.press('Escape');
          await p.locator('.editor-post-publish-button, .editor-post-publish-button__button').first().click();
          await p.waitForTimeout(6000);
          const texto = await p.locator('body').innerText();
          const errores = await p.locator('.acf-error-message, .acf-notice.-error, .acf-admin-notice.-error').allInnerTexts();
          console.log('avisos ACF:', JSON.stringify(errores));
          await p.screenshot({ path: '/tmp/pw/editor.png', fullPage: false });
          await b.close();
          if (/Validation failed|requieren atención|requiere atención/i.test(texto + errores.join(' '))) { console.log('✖ la validación bloqueó el guardado'); process.exit(1); }
          JS
          sed -i 's/^          //' editor.mjs
          node editor.mjs "$URL" "$post" "$foto"
          w eval-file "$GITHUB_WORKSPACE/wordpress/scripts/revisar-fotos.php" | head -20   # monthly photo report runs clean
          echo "== repetidores DESPUÉS"; dump
          fuente_despues=$(w post meta get "$post" fuentes_0_nombre || true)
          [[ "$fuente_despues" == "$fuente_antes" ]] && echo "✓ guardar desde el panel no borra las fuentes" || { echo "✖ las fuentes cambiaron al guardar: '$fuente_antes' → '$fuente_despues'"; exit 1; }
          got=$(w post meta get "$post" _thumbnail_id)
          [[ "$got" == "$foto" ]] && echo "✓ el editor reemplazó la foto y guardó" || { echo "✖ foto destacada = $got (esperado $foto)"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-captura
          path: /tmp/pw/editor.png
          if-no-files-found: ignore
