                $lic = [ "es" => "sí la incluyen, según el operador o agencias, Itatí y los lodges del Iberá de la tabla, y una agencia dice lo mismo del lodge del Alto Paraná de US\$ 7.000", "en" => "Itatí and the Iberá lodges in the table do include it, according to the operator or agencies, and one agency says the same of the US\$ 7,000 Upper Paraná lodge", "pt" => "incluem, segundo o operador ou agências, Itatí e os lodges do Iberá da tabela, e uma agência diz o mesmo do lodge do Alto Paraná de US\$ 7.000" ];
