name: Test WordPress (throwaway install)

# There is no staging: a PHP fatal in the plugin or theme takes the live site
# down. Every PR touching wordpress/** runs the plugin and theme on a fresh
# WordPress (MySQL service + wp server), creates sample content (the Esquina
# script, an interview, an outfitter), renders the main pages and sends an
# inquiry through the real form. Fails on any PHP warning or fatal.

on:
  pull_request:
    paths: ['wordpress/**', '.github/workflows/test-wp.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP: /tmp/wp
      URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - name: Brand rules (docs/marca.md)
        run: node wordpress/build/revisar-marca.mjs
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, gd, mbstring
          tools: wp-cli
      - name: Install WordPress + SCF + plugin + theme
        run: |
          w() { wp --path="$WP" "$@"; }
          mkdir -p "$WP"
          w core download --locale=es_AR --quiet
          w config create --dbname=wp --dbuser=root --dbpass=root --dbhost=127.0.0.1 --quiet
          w config set WP_DEBUG true --raw
          w config set WP_DEBUG_LOG true --raw
          w config set WP_DEBUG_DISPLAY false --raw
          w core install --url="$URL" --title=Pescamapa --admin_user=admin --admin_password=admin --admin_email=test@example.com --skip-email --quiet
          w plugin install secure-custom-fields --activate --quiet
          cp -r wordpress/plugins/pescamapa-core "$WP/wp-content/plugins/"
          cp -r wordpress/themes/pescamapa "$WP/wp-content/themes/"
          echo "test" > "$WP/wp-content/themes/pescamapa/build.txt"
          w plugin activate pescamapa-core
          w theme activate pescamapa
          w option update permalink_structure '/%postname%/'
          w eval 'flush_rewrite_rules( false );'
      - name: Sample content
        run: |
          w() { wp --path="$WP" "$@"; }
          for e in dorado:Dorado surubi:Surubí; do
            id=$(w post create --post_type=pm_especie --post_status=publish --post_title="${e#*:}" --porcelain)
            w eval "update_field( 'idioma', 'es', $id ); update_field( 'clave', '${e%%:*}', $id );"
          done
          w eval-file wordpress/scripts/esquina-2026-10-20.php
          w eval-file wordpress/scripts/esquina-2026-10-20.php   # idempotent: second run does nothing
          w eval-file wordpress/scripts/esquina-reglamento-2026-10-20.php
          w eval-file wordpress/scripts/flycast-2026-10-21.php
          w eval-file wordpress/scripts/flycast-2026-10-21.php   # idempotent
          w eval-file wordpress/scripts/paso-de-la-patria-2026-10-21.php
          w eval-file wordpress/scripts/paso-de-la-patria-2026-10-21.php   # idempotent
          w eval-file wordpress/scripts/prestadores-2026-10-20.php
          w eval-file wordpress/scripts/prestadores-2026-10-20.php   # idempotent
          sed 's/^\$aplicar = false;/$aplicar = true;/' wordpress/scripts/ogaraity-2026-10-24.php > /tmp/ogaraity.php
          w eval-file /tmp/ogaraity.php
          w eval-file /tmp/ogaraity.php   # idempotent
          [[ "$(w post list --post_type=pm_prestador --title='Apart Ogaraity Hotel' --format=count)" == 1 ]] || { echo '✖ Ogaraity no se creó una sola vez'; exit 1; }
          sed 's/^\$aplicar = false;/$aplicar = true;/' wordpress/scripts/experiencia-isoro-2026-10-24.php > /tmp/isoro.php
          w eval-file /tmp/isoro.php
          w eval-file /tmp/isoro.php   # idempotent: updates the same record
          [[ "$(w post list --post_type=pm_prestador --title='Experiencia Isoró' --format=count)" == 1 ]] || { echo '✖ Experiencia Isoró no quedó una sola vez'; exit 1; }
          [[ "$(w post list --post_type=pm_prestador --title='Agus — guía de pesca en Goya' --format=count)" == 0 ]] || { echo '✖ el ejemplo Agus sigue ahí'; exit 1; }
          sed 's/^\$aplicar = false;/$aplicar = true;/' wordpress/scripts/especies-dorado-surubi-2026-10-24.php > /tmp/especies.php
          w eval-file /tmp/especies.php
          w eval-file /tmp/especies.php   # idempotent
          # The script leaves Esquina as a draft; publish it here to render it.
          w post update $(w post list --post_type=pm_destino --post_status=draft --format=ids) --post_status=publish
          # The sizes-and-quotas FAQ only sees published guides (as on the server).
          w eval-file wordpress/scripts/reglas-corrientes-2026-10-21.php
          w eval-file wordpress/scripts/reglas-corrientes-2026-10-21.php   # idempotent
          # Packages page: the Goya script run against Esquina (the guide that exists here).
          sed "s/^\$aplicar = false;/\$aplicar = true;/; s/^\$destino = 'goya';/\$destino = 'esquina';/" wordpress/scripts/paquetes-goya-2026-10-28.php > /tmp/paquetes.php
          w eval-file /tmp/paquetes.php
          w eval-file /tmp/paquetes.php   # idempotent
          w eval '
            $e = pm_buscar( "pm_destino", "esquina", "es" );
            $f = pm_filas( "paquetes", $e->ID );
            $f[0]["desde_monto"] = 150000; $f[0]["desde_moneda"] = "ARS"; $f[0]["desde_unidad"] = "por lancha"; $f[0]["desde_fecha"] = "20261028";
            $f[1]["desde_monto"] = 99999; $f[1]["desde_moneda"] = "ARS"; $f[1]["desde_unidad"] = "por lancha"; // no date: must not show
            $f[2]["publicado"] = 0; $f[2]["titulo"] = "PAQUETE-OCULTO"; $f[2]["interno"] = "INTERNO-NO-PUBLICO";
            update_field( "paquetes", $f, $e->ID );
            update_field( "paquetes_intro", "INTRO-DE-PRUEBA", $e->ID ); update_field( "paquetes_description", "DESC-DE-PRUEBA", $e->ID );
            update_field( "paquetes_info", [ [ "titulo" => "INFO-DE-PRUEBA", "texto" => "Primer párrafo de prueba\nSegundo párrafo de prueba", "fuente_nombre" => "FUENTE-INFO", "fuente_url" => "https://example.com/info", "consultada" => "20261028" ], [ "titulo" => "", "texto" => "BLOQUE-SIN-TITULO" ] ], $e->ID );
          '
          # Package prices keep their cents; the page date follows the newest price date.
          w eval '
            $ok = "€ 599,69" === pm_paquete_precio_txt( [ "monto" => 599.69, "moneda" => "EUR" ], "es" )
              && "€ 599.69" === pm_paquete_precio_txt( [ "monto" => 599.69, "moneda" => "EUR" ], "en" )
              && "€ 599,69" === pm_paquete_precio_txt( [ "monto" => 599.69, "moneda" => "EUR" ], "pt" )
              && "US$ 550" === pm_paquete_precio_txt( [ "monto" => 550, "moneda" => "USD" ], "es" )
              && "$ 150.000" === pm_paquete_precio_txt( [ "monto" => 150000, "moneda" => "ARS" ], "es" )
              && "US$ 1,200" === pm_paquete_precio_txt( [ "monto" => 1200, "moneda" => "USD" ], "en" );
            $ok = $ok && "2027-12-31" === pm_paquetes_modificado( [ [ "precio" => [ "fecha" => "20271231" ] ], [ "precio" => null ] ], "2026-10-30" )
              && "2026-11-11" === pm_paquetes_modificado( [ [ "precio" => [ "fecha" => "2026-11-11" ] ] ], "2026-10-30" )
              && "2026-10-30" === pm_paquetes_modificado( [ [ "precio" => [ "fecha" => "2026-10-01" ] ] ], "2026-10-30" );
            $ok || WP_CLI::error( "pm_paquete_precio_txt / pm_paquetes_modificado: resultado inesperado" );
          '
          w eval '
            $id = wp_insert_post( [ "post_type" => "pm_entrevista", "post_status" => "publish", "post_title" => "Prueba: el río manda", "post_name" => "prueba-el-rio-manda", "post_content" => "<!-- wp:paragraph --><p>Charla de prueba.</p><!-- /wp:paragraph -->" ] );
            foreach ( [ "idioma" => "es", "clave" => "prueba", "persona" => "Persona Prueba", "destino" => "esquina", "fecha" => "20261020", "consentimiento" => 1, "rol" => "Guía de prueba", "bajada" => "Bajada de prueba", "seo_title" => "Prueba", "seo_description" => "Descripción de prueba" ] as $k => $v ) { update_field( $k, $v, $id ); }
            update_field( "citas", [ [ "cita" => "CITA-DE-PRUEBA en Esquina", "tema" => "temporada" ] ], $id );
            $sin = wp_insert_post( [ "post_type" => "pm_entrevista", "post_status" => "publish", "post_title" => "Sin permiso", "post_name" => "sin-permiso" ] );
            foreach ( [ "idioma" => "es", "clave" => "sin-permiso", "persona" => "Otra", "destino" => "esquina", "fecha" => "20261020", "consentimiento" => 0, "rol" => "x" ] as $k => $v ) { update_field( $k, $v, $sin ); }
            update_field( "citas", [ [ "cita" => "CITA-SIN-PERMISO", "tema" => "consejo" ] ], $sin );
            $n = wp_insert_post( [ "post_type" => "pm_nota", "post_status" => "publish", "post_title" => "Nota de prueba: el río manda", "post_name" => "nota-de-prueba", "post_content" => "<!-- wp:paragraph --><p>Texto de la nota.</p><!-- /wp:paragraph --><!-- wp:quote --><blockquote class=\"wp-block-quote\"><p>Cita dentro del texto.</p></blockquote><!-- /wp:quote -->" ] );
            foreach ( [ "idioma" => "es", "clave" => "nota-prueba", "nota_tipo" => "datos", "nota_destino" => "esquina", "nota_fecha" => "20261021", "bajada" => "Bajada de la nota", "seo_title" => "Nota de prueba", "seo_description" => "Descripción de la nota de prueba" ] as $k => $v ) { update_field( $k, $v, $n ); }
            update_field( "nota_datos", [ [ "dato" => "DATO-CLAVE-DE-PRUEBA" ], [ "dato" => "PENDIENTE: dato sin confirmar" ] ], $n );
            update_field( "fuentes", [ [ "nombre" => "FUENTE-DE-PRUEBA", "url" => "https://example.com/fuente", "oficial" => 0, "consultada" => "20261021" ] ], $n );
            $esq = pm_buscar( "pm_destino", "esquina", "es" );
            update_field( "mas", [ [ "nombre" => "MAS-GRATIS", "url" => "https://example.com/a", "texto" => "Un paseo", "patrocinado" => 0 ], [ "nombre" => "MAS-PAGO", "url" => "https://example.com/b", "texto" => "Un aviso", "patrocinado" => 1 ] ], $esq->ID );
            $pub = wp_insert_post( [ "post_type" => "pm_prestador", "post_status" => "publish", "post_title" => "PRESTADOR-PUBLICO" ] );
            foreach ( [ "tipo" => [ "operador" ], "prest_destino" => "esquina", "prest_publico" => 1, "prest_fuente" => "https://example.com/prestador" ] as $k => $v ) { update_field( $k, $v, $pub ); }
            $ac = wp_insert_post( [ "post_type" => "pm_prestador", "post_status" => "publish", "post_title" => "PRESTADOR-CON-ACUERDO" ] );
            foreach ( [ "tipo" => [ "guia" ], "prest_destino" => "esquina", "prest_consentimiento" => 1, "estado" => "acuerdo", "prest_oferta" => "OFERTA-DE-PRUEBA", "prest_idiomas" => [ "pt", "en" ], "prest_accesible" => "si" ] as $k => $v ) { update_field( $k, $v, $ac ); }
            $sa = wp_insert_post( [ "post_type" => "pm_prestador", "post_status" => "publish", "post_title" => "PRESTADOR-SIN-ACUERDO" ] );
            foreach ( [ "tipo" => [ "guia" ], "prest_destino" => "esquina", "prest_consentimiento" => 1, "estado" => "contactado", "prest_oferta" => "OFERTA-NO-ACORDADA", "prest_accesible" => "no" ] as $k => $v ) { update_field( $k, $v, $sa ); }
            $no = wp_insert_post( [ "post_type" => "pm_prestador", "post_status" => "publish", "post_title" => "PRESTADOR-NO-PUBLICO" ] );
            foreach ( [ "tipo" => [ "guia" ], "prest_destino" => "esquina" ] as $k => $v ) { update_field( $k, $v, $no ); }
            $r = wp_insert_post( [ "post_type" => "pm_prestador", "post_status" => "publish", "post_title" => "PRESTADOR-DE-PRUEBA" ] );
            foreach ( [ "tipo" => [ "guia" ], "prest_destino" => "esquina", "prest_modalidades" => [ "mosca" ], "prest_especies" => [ "dorado" ], "equipo" => [ "motor_electrico" ], "incluye" => [ "carnada", "comida" ], "precio" => "Desde $ 1", "precio_fecha" => "20261020", "prest_consentimiento" => 1, "whatsapp" => "CONTACTO-INTERNO-123" ] as $k => $v ) { update_field( $k, $v, $r ); }
          '
      - name: SEO consultas fixtures (FAQ in content, overrides, season FAQ)
        run: |
          cat > /tmp/seo-consultas.php <<'PHP'
          <?php
          $faq = "<!-- wp:group {\"className\":\"pm-faq\"} -->\n<div class=\"wp-block-group pm-faq\"><!-- wp:heading {\"level\":3} -->\n<h3 class=\"wp-block-heading\">PREGUNTA-DE-PRUEBA</h3>\n<!-- /wp:heading -->\n\n<!-- wp:paragraph -->\n<p>RESPUESTA-DE-PRUEBA con <a href=\"https://example.com\">enlace</a>.</p>\n<!-- /wp:paragraph --></div>\n<!-- /wp:group -->";
          $e = pm_buscar( 'pm_especie', 'dorado', 'es' );
          $n = get_page_by_path( 'nota-de-prueba', OBJECT, 'pm_nota' );
          ( $e && $n ) || WP_CLI::error( 'faltan la especie o la nota de prueba' );
          foreach ( [ $e, $n ] as $p ) {
              wp_update_post( [ 'ID' => $p->ID, 'post_content' => wp_slash( $p->post_content . "\n\n" . $faq ) ] );
          }
          $f = pm_faqs_contenido( get_post( $n->ID )->post_content );
          ( 1 === count( $f ) && 'PREGUNTA-DE-PRUEBA' === $f[0]['pregunta'] && 'RESPUESTA-DE-PRUEBA con enlace.' === $f[0]['respuesta'] ) || WP_CLI::error( 'pm_faqs_contenido: ' . wp_json_encode( $f ) );
          ( [] === pm_faqs_contenido( '<p>sin faq</p>' ) ) || WP_CLI::error( 'pm_faqs_contenido sin grupo debe dar []' );
          // Optional per-destination texts: the override wins, the template stays for every other guide.
          ( 'Fly fishing guides and outfitters in Esquel and Trevelin, Argentina' === pm_t_clave( 'guias.title', 'esquel-trevelin', [ 'lugar' => 'X' ], 'en' ) ) || WP_CLI::error( 'override guias.title' );
          ( pm_t( 'guias.title', [ 'lugar' => 'Goya' ], 'en' ) === pm_t_clave( 'guias.title', 'goya', [ 'lugar' => 'Goya' ], 'en' ) ) || WP_CLI::error( 'sin override debe usar la plantilla' );
          ( pm_t_existe( 'prov.intro.tierra-del-fuego', 'en' ) && ! pm_t_existe( 'prov.intro.corrientes', 'en' ) ) || WP_CLI::error( 'prov.intro' );
          foreach ( [ 'es', 'en', 'pt' ] as $i ) {
              $w = count( preg_split( '/\s+/', pm_t( 'prov.intro.tierra-del-fuego', [], $i ) ) );
              ( $w >= 60 && $w <= 100 ) || WP_CLI::error( "prov.intro.tierra-del-fuego ($i): $w palabras" );
              ( mb_strlen( pm_t( 'prov.description.tierra-del-fuego', [], $i ) ) <= 160 ) || WP_CLI::error( "prov.description.tierra-del-fuego ($i) > 160" );
          }
          // Season FAQ of the guides page: composed from the guide's own fields, with its source and check date.
          $d = [ 'idioma' => 'en', 'nombre' => 'Esquel', 'abre' => '2026-11-01', 'cierra' => '2027-05-01', 'temporada_nota' => 'Futaleufú until 30 June 2027.', 'reglamento' => [ 'autoridad' => 'AUTORIDAD-DE-PRUEBA', 'verificado' => '2026-11-04' ] ];
          $q = pm_guias_faqs( $d, 'esquel-trevelin' );
          ( 5 === count( $q ) && 'When is the fly fishing season in Esquel and Trevelin?' === $q[4]['pregunta'] && false !== strpos( $q[4]['respuesta'], '1 November 2026 to 1 May 2027' ) && false !== strpos( $q[4]['respuesta'], 'AUTORIDAD-DE-PRUEBA' ) && false !== strpos( $q[4]['respuesta'], '4 November 2026' ) ) || WP_CLI::error( 'pm_guias_faqs: ' . wp_json_encode( $q ) );
          $d['abre'] = '';
          ( 4 === count( pm_guias_faqs( $d, 'esquel-trevelin' ) ) ) || WP_CLI::error( 'sin fechas no hay pregunta de temporada' );
          WP_CLI::success( 'SEO consultas: helpers ok' );
          PHP
          sed -i 's/^          //' /tmp/seo-consultas.php
          wp --path="$WP" eval-file /tmp/seo-consultas.php
      - name: Prestador card fields (programme, minimum stay, companion, not included, capacity unit)
        run: wp --path="$WP" eval-file "$GITHUB_WORKSPACE/.github/scripts/prestador-campos.php"
      - name: Corrientes lodge guides - create, read back, render, clean up
        run: |
          w() { wp --path="$WP" "$@"; }
          # Stub notes the guides link to (the real ones are created later in this workflow); removed again at the end of this step.
          w eval '
            $claves = [ "tallas-cupos-vedas", "pesca-desde-brasil-corrientes", "precio-viaje-dorado-lodge", "viaje-dorado-amigos-precios", "licencias-extranjeros-argentina", "cuando-pescar-dorado", "golden-dorado-guia" ];
            foreach ( [ "es", "en", "pt" ] as $i ) {
              foreach ( $claves as $c ) {
                $cuerpo = "golden-dorado-guia" === $c ? "<!-- wp:table --><figure class=\"wp-block-table\"><table><tbody><tr><td>Alto Paraná</td><td>Itatí, Ituzaingó, Paso de la Patria</td></tr></tbody></table></figure><!-- /wp:table -->" : "Nota de prueba";
                $id = wp_insert_post( [ "post_type" => "pm_nota", "post_status" => "publish", "post_title" => "Prueba {$c} {$i}", "post_name" => "prueba-{$c}-{$i}", "post_content" => $cuerpo ], true );
                update_field( "idioma", $i, $id ); update_field( "clave", $c, $id ); update_post_meta( $id, "_prueba_corrientes", 1 );
              }
            }'
          for s in itati-2026-11-14 ita-ibate-2026-11-14 esteros-del-ibera-2026-11-14; do
            sed 's/^\$aplicar = true;/$aplicar = false;/' "wordpress/scripts/$s.php" > "/tmp/$s-dry.php"
            wp --path="$WP" eval-file "/tmp/$s-dry.php"   # dry run: must write nothing
            n=$(w post list --post_type=pm_destino --post_status=any --meta_key=clave --meta_value="${s%-2026-11-14}" --format=count)
            [[ "$n" == 0 ]] || { echo "✖ el simulacro de $s escribió $n guías"; exit 1; }
            cp "wordpress/scripts/$s.php" "/tmp/$s.php"   # committed with $aplicar = true (already applied live)
            wp --path="$WP" eval-file "/tmp/$s.php"
            wp --path="$WP" eval-file "/tmp/$s.php"   # idempotent: nothing is touched the second time
            n=$(w post list --post_type=pm_destino --post_status=publish --meta_key=clave --meta_value="${s%-2026-11-14}" --format=count)
            [[ "$n" == 3 ]] && echo "✓ $s: guía en 3 idiomas" || { echo "✖ $s: $n guías (esperado 3)"; exit 1; }
          done
          sed 's/^\$aplicar = true;/$aplicar = false;/' wordpress/scripts/corrientes-enlaces-2026-11-14.php > /tmp/enlaces-dry.php
          cp wordpress/scripts/corrientes-enlaces-2026-11-14.php /tmp/enlaces.php
          wp --path="$WP" eval-file /tmp/enlaces-dry.php
          wp --path="$WP" eval-file /tmp/enlaces.php
          wp --path="$WP" eval-file /tmp/enlaces.php   # idempotent
          wp --path="$WP" server --host=localhost --port=8081 > /tmp/server-corrientes.log 2>&1 &
          sleep 3
          fail=0
          chk() { # path must-contain [must-not-contain]
            code=$(curl -sS -o page-c.html -w '%{http_code}' "http://localhost:8081$1")
            if [[ "$code" != 200 ]]; then echo "✖ $code $1"; fail=1; return; fi
            if [[ -n "${2:-}" ]] && ! grep -q -- "$2" page-c.html; then echo "✖ $1 no contiene: $2"; fail=1; return; fi
            if [[ -n "${3:-}" ]] && grep -q -- "$3" page-c.html; then echo "✖ $1 contiene: $3"; fail=1; return; fi
            echo "✓ 200 $1"
          }
          for p in /litoral/corrientes/pesca-en-itati/ /litoral/corrientes/pesca-en-ita-ibate/ /litoral/corrientes/pesca-en-los-esteros-del-ibera/ \
                   /en/litoral/corrientes/fishing-in-itati/ /en/litoral/corrientes/fishing-in-ita-ibate/ /en/litoral/corrientes/fishing-in-the-ibera-wetlands/ \
                   /pt/litoral/corrientes/pesca-em-itati/ /pt/litoral/corrientes/pesca-em-ita-ibate/ /pt/litoral/corrientes/pesca-nos-esteros-do-ibera/; do
            chk "$p" 'TouristDestination' 'PENDIENTE'
            grep -q 'FAQPage' page-c.html || { echo "✖ $p sin FAQPage"; fail=1; }
            grep -q 'hreflang="x-default"' page-c.html || { echo "✖ $p sin x-default"; fail=1; }
            grep -qE 'class="prestador' page-c.html || { echo "✖ $p sin tarjetas de prestador"; fail=1; }
            grep -qE '7[.,]850|Farbank|Orvis|Yellow Dog' page-c.html && { echo "✖ $p muestra una cifra o un nombre de agencia"; fail=1; }
          done
          chk /litoral/corrientes/pesca-en-itati/ 'US\$ 7.950' 'jazmin'
          chk /litoral/corrientes/pesca-en-los-esteros-del-ibera/ 'sin año' 
          chk /litoral/corrientes/pesca-en-itati/ 'Otros destinos de dorado en Corrientes'
          chk /en/litoral/corrientes/fishing-in-the-ibera-wetlands/ 'Other dorado destinations in Corrientes'
          chk /notas/prueba-golden-dorado-guia-es/ 'Lodges con guía en Corrientes'
          chk /en/notes/prueba-golden-dorado-guia-en/ 'Guided lodges in Corrientes'
          chk /especies/dorado/ 'pesca-en-itati'
          chk /litoral/corrientes/ 'pesca-en-itati'
          chk /llms.txt 'pesca-en-ita-ibate'
          chk /wp-sitemap-posts-pm_destino-1.xml 'pesca-en-los-esteros-del-ibera'
          # Clean up: this step must leave no trace for the checks that follow.
          w eval '
            foreach ( [ "pm_destino", "pm_nota" ] as $t ) {
              foreach ( get_posts( [ "post_type" => $t, "post_status" => "any", "posts_per_page" => -1, "suppress_filters" => true ] ) as $p ) {
                $c = (string) get_post_meta( $p->ID, "clave", true );
