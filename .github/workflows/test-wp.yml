name: Test WordPress (throwaway install)

# There is no staging: a PHP fatal in the plugin or theme takes the live site
# down. Every PR touching wordpress/** runs the plugin and theme on a fresh
# WordPress (MySQL service + wp server), creates sample content (the Esquina
# script, an interview, an outfitter), renders the main pages and sends an
# inquiry through the real form. Fails on any PHP warning or fatal.

on:
  pull_request:
    paths: ['wordpress/**', '.github/workflows/test-wp.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP: /tmp/wp
      URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - name: Brand rules (docs/marca.md)
        run: node wordpress/build/revisar-marca.mjs
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, gd, mbstring
          tools: wp-cli
      - name: Install WordPress + SCF + plugin + theme
        run: |
          w() { wp --path="$WP" "$@"; }
          mkdir -p "$WP"
          w core download --locale=es_AR --quiet
          w config create --dbname=wp --dbuser=root --dbpass=root --dbhost=127.0.0.1 --quiet
          w config set WP_DEBUG true --raw
          w config set WP_DEBUG_LOG true --raw
          w config set WP_DEBUG_DISPLAY false --raw
          w core install --url="$URL" --title=Pescamapa --admin_user=admin --admin_password=admin --admin_email=test@example.com --skip-email --quiet
          w plugin install secure-custom-fields --activate --quiet
          cp -r wordpress/plugins/pescamapa-core "$WP/wp-content/plugins/"
          cp -r wordpress/themes/pescamapa "$WP/wp-content/themes/"
          echo "test" > "$WP/wp-content/themes/pescamapa/build.txt"
          w plugin activate pescamapa-core
          w theme activate pescamapa
          w option update permalink_structure '/%postname%/'
          w eval 'flush_rewrite_rules( false );'
      - name: Sample content
        run: |
          w() { wp --path="$WP" "$@"; }
          for e in dorado:Dorado surubi:Surubí; do
            id=$(w post create --post_type=pm_especie --post_status=publish --post_title="${e#*:}" --porcelain)
            w eval "update_field( 'idioma', 'es', $id ); update_field( 'clave', '${e%%:*}', $id );"
          done
          w eval-file wordpress/scripts/esquina-2026-10-20.php
          w eval-file wordpress/scripts/esquina-2026-10-20.php   # idempotent: second run does nothing
          w eval-file wordpress/scripts/esquina-reglamento-2026-10-20.php
          w eval-file wordpress/scripts/flycast-2026-10-21.php
          w eval-file wordpress/scripts/flycast-2026-10-21.php   # idempotent
          w eval-file wordpress/scripts/paso-de-la-patria-2026-10-21.php
          w eval-file wordpress/scripts/paso-de-la-patria-2026-10-21.php   # idempotent
          w eval-file wordpress/scripts/prestadores-2026-10-20.php
          w eval-file wordpress/scripts/prestadores-2026-10-20.php   # idempotent
          sed 's/^\$aplicar = false;/$aplicar = true;/' wordpress/scripts/ogaraity-2026-10-24.php > /tmp/ogaraity.php
          w eval-file /tmp/ogaraity.php
          w eval-file /tmp/ogaraity.php   # idempotent
          [[ "$(w post list --post_type=pm_prestador --title='Apart Ogaraity Hotel' --format=count)" == 1 ]] || { echo '✖ Ogaraity no se creó una sola vez'; exit 1; }
          sed 's/^\$aplicar = false;/$aplicar = true;/' wordpress/scripts/experiencia-isoro-2026-10-24.php > /tmp/isoro.php
          w eval-file /tmp/isoro.php
          w eval-file /tmp/isoro.php   # idempotent: updates the same record
          [[ "$(w post list --post_type=pm_prestador --title='Experiencia Isoró' --format=count)" == 1 ]] || { echo '✖ Experiencia Isoró no quedó una sola vez'; exit 1; }
          [[ "$(w post list --post_type=pm_prestador --title='Agus — guía de pesca en Goya' --format=count)" == 0 ]] || { echo '✖ el ejemplo Agus sigue ahí'; exit 1; }
          sed 's/^\$aplicar = false;/$aplicar = true;/' wordpress/scripts/especies-dorado-surubi-2026-10-24.php > /tmp/especies.php
          w eval-file /tmp/especies.php
          w eval-file /tmp/especies.php   # idempotent
          # The script leaves Esquina as a draft; publish it here to render it.
          w post update $(w post list --post_type=pm_destino --post_status=draft --format=ids) --post_status=publish
          # The sizes-and-quotas FAQ only sees published guides (as on the server).
          w eval-file wordpress/scripts/reglas-corrientes-2026-10-21.php
          w eval-file wordpress/scripts/reglas-corrientes-2026-10-21.php   # idempotent
          # Packages page: the Goya script run against Esquina (the guide that exists here).
          sed "s/^\$aplicar = false;/\$aplicar = true;/; s/^\$destino = 'goya';/\$destino = 'esquina';/" wordpress/scripts/paquetes-goya-2026-10-28.php > /tmp/paquetes.php
          w eval-file /tmp/paquetes.php
          w eval-file /tmp/paquetes.php   # idempotent
          w eval '
            $e = pm_buscar( "pm_destino", "esquina", "es" );
            $f = pm_filas( "paquetes", $e->ID );
            $f[0]["desde_monto"] = 150000; $f[0]["desde_moneda"] = "ARS"; $f[0]["desde_unidad"] = "por lancha"; $f[0]["desde_fecha"] = "20261028";
            $f[1]["desde_monto"] = 99999; $f[1]["desde_moneda"] = "ARS"; $f[1]["desde_unidad"] = "por lancha"; // no date: must not show
            $f[2]["publicado"] = 0; $f[2]["titulo"] = "PAQUETE-OCULTO"; $f[2]["interno"] = "INTERNO-NO-PUBLICO";
            update_field( "paquetes", $f, $e->ID );
            update_field( "paquetes_intro", "INTRO-DE-PRUEBA", $e->ID ); update_field( "paquetes_description", "DESC-DE-PRUEBA", $e->ID );
            update_field( "paquetes_info", [ [ "titulo" => "INFO-DE-PRUEBA", "texto" => "Primer párrafo de prueba\nSegundo párrafo de prueba", "fuente_nombre" => "FUENTE-INFO", "fuente_url" => "https://example.com/info", "consultada" => "20261028" ], [ "titulo" => "", "texto" => "BLOQUE-SIN-TITULO" ] ], $e->ID );
          '
          w eval '
            $id = wp_insert_post( [ "post_type" => "pm_entrevista", "post_status" => "publish", "post_title" => "Prueba: el río manda", "post_name" => "prueba-el-rio-manda", "post_content" => "<!-- wp:paragraph --><p>Charla de prueba.</p><!-- /wp:paragraph -->" ] );
            foreach ( [ "idioma" => "es", "clave" => "prueba", "persona" => "Persona Prueba", "destino" => "esquina", "fecha" => "20261020", "consentimiento" => 1, "rol" => "Guía de prueba", "bajada" => "Bajada de prueba", "seo_title" => "Prueba", "seo_description" => "Descripción de prueba" ] as $k => $v ) { update_field( $k, $v, $id ); }
            update_field( "citas", [ [ "cita" => "CITA-DE-PRUEBA en Esquina", "tema" => "temporada" ] ], $id );
            $sin = wp_insert_post( [ "post_type" => "pm_entrevista", "post_status" => "publish", "post_title" => "Sin permiso", "post_name" => "sin-permiso" ] );
            foreach ( [ "idioma" => "es", "clave" => "sin-permiso", "persona" => "Otra", "destino" => "esquina", "fecha" => "20261020", "consentimiento" => 0, "rol" => "x" ] as $k => $v ) { update_field( $k, $v, $sin ); }
            update_field( "citas", [ [ "cita" => "CITA-SIN-PERMISO", "tema" => "consejo" ] ], $sin );
            $n = wp_insert_post( [ "post_type" => "pm_nota", "post_status" => "publish", "post_title" => "Nota de prueba: el río manda", "post_name" => "nota-de-prueba", "post_content" => "<!-- wp:paragraph --><p>Texto de la nota.</p><!-- /wp:paragraph --><!-- wp:quote --><blockquote class=\"wp-block-quote\"><p>Cita dentro del texto.</p></blockquote><!-- /wp:quote -->" ] );
            foreach ( [ "idioma" => "es", "clave" => "nota-prueba", "nota_tipo" => "datos", "nota_destino" => "esquina", "nota_fecha" => "20261021", "bajada" => "Bajada de la nota", "seo_title" => "Nota de prueba", "seo_description" => "Descripción de la nota de prueba" ] as $k => $v ) { update_field( $k, $v, $n ); }
            update_field( "nota_datos", [ [ "dato" => "DATO-CLAVE-DE-PRUEBA" ], [ "dato" => "PENDIENTE: dato sin confirmar" ] ], $n );
            update_field( "fuentes", [ [ "nombre" => "FUENTE-DE-PRUEBA", "url" => "https://example.com/fuente", "oficial" => 0, "consultada" => "20261021" ] ], $n );
            $esq = pm_buscar( "pm_destino", "esquina", "es" );
            update_field( "mas", [ [ "nombre" => "MAS-GRATIS", "url" => "https://example.com/a", "texto" => "Un paseo", "patrocinado" => 0 ], [ "nombre" => "MAS-PAGO", "url" => "https://example.com/b", "texto" => "Un aviso", "patrocinado" => 1 ] ], $esq->ID );
            $pub = wp_insert_post( [ "post_type" => "pm_prestador", "post_status" => "publish", "post_title" => "PRESTADOR-PUBLICO" ] );
            foreach ( [ "tipo" => [ "operador" ], "prest_destino" => "esquina", "prest_publico" => 1, "prest_fuente" => "https://example.com/prestador" ] as $k => $v ) { update_field( $k, $v, $pub ); }
            $ac = wp_insert_post( [ "post_type" => "pm_prestador", "post_status" => "publish", "post_title" => "PRESTADOR-CON-ACUERDO" ] );
            foreach ( [ "tipo" => [ "guia" ], "prest_destino" => "esquina", "prest_consentimiento" => 1, "estado" => "acuerdo", "prest_oferta" => "OFERTA-DE-PRUEBA", "prest_idiomas" => [ "pt", "en" ], "prest_accesible" => "si" ] as $k => $v ) { update_field( $k, $v, $ac ); }
            $sa = wp_insert_post( [ "post_type" => "pm_prestador", "post_status" => "publish", "post_title" => "PRESTADOR-SIN-ACUERDO" ] );
            foreach ( [ "tipo" => [ "guia" ], "prest_destino" => "esquina", "prest_consentimiento" => 1, "estado" => "contactado", "prest_oferta" => "OFERTA-NO-ACORDADA", "prest_accesible" => "no" ] as $k => $v ) { update_field( $k, $v, $sa ); }
            $no = wp_insert_post( [ "post_type" => "pm_prestador", "post_status" => "publish", "post_title" => "PRESTADOR-NO-PUBLICO" ] );
            foreach ( [ "tipo" => [ "guia" ], "prest_destino" => "esquina" ] as $k => $v ) { update_field( $k, $v, $no ); }
            $r = wp_insert_post( [ "post_type" => "pm_prestador", "post_status" => "publish", "post_title" => "PRESTADOR-DE-PRUEBA" ] );
            foreach ( [ "tipo" => [ "guia" ], "prest_destino" => "esquina", "prest_modalidades" => [ "mosca" ], "prest_especies" => [ "dorado" ], "equipo" => [ "motor_electrico" ], "incluye" => [ "carnada", "comida" ], "precio" => "Desde $ 1", "precio_fecha" => "20261020", "prest_consentimiento" => 1, "whatsapp" => "CONTACTO-INTERNO-123" ] as $k => $v ) { update_field( $k, $v, $r ); }
          '
      - name: Render pages
        run: |
          wp --path="$WP" server --host=localhost --port=8080 > /tmp/server.log 2>&1 &
          sleep 3
          fail=0
          check() { # path status [must-contain] [must-not-contain]
            code=$(curl -sS -o page.html -w '%{http_code}' "$URL$1")
            if [[ "$code" != "$2" ]]; then echo "✖ $code $1 (esperado $2)"; fail=1; return; fi
            if [[ -n "${3:-}" ]] && ! grep -q -- "$3" page.html; then echo "✖ $1 no contiene: $3"; fail=1; return; fi
            if [[ -n "${4:-}" ]] && grep -q -- "$4" page.html; then echo "✖ $1 contiene: $4"; fail=1; return; fi
            echo "✓ $code $1"
          }
          check / 200 'PESCAMAPA'
          check /en/ 200 'lang="en"'
          check / 200 'class="menu-btn"'
          check / 200 'id="menu-principal"'
          check /en/ 200 'aria-label="Menu"'
          check / 200 'Armá tu viaje →'
          check / 200 'Investigación propia'
          check /en/ 200 'Plan your trip →'
          check /mapa/ 200
          check /litoral/corrientes/pesca-en-esquina/ 200 'TouristDestination' 'PENDIENTE'
          check /litoral/corrientes/pesca-en-esquina/ 200 'CITA-DE-PRUEBA' 'CITA-SIN-PERMISO'
          check /litoral/corrientes/pesca-en-esquina/ 200 'PRESTADOR-DE-PRUEBA' 'CONTACTO-INTERNO-123'
          check /litoral/corrientes/pesca-en-esquina/ 200 'admin-post.php'
          # Public listing: shown, labelled unverified, with the removal link; no listing flag, no card.
          check /litoral/corrientes/pesca-en-esquina/ 200 'PRESTADOR-PUBLICO' 'PRESTADOR-NO-PUBLICO'
          check /litoral/corrientes/pesca-en-esquina/ 200 'mailto:info@pescamapa.com?subject='
          check /litoral/corrientes/pesca-en-esquina/ 200 'sin verificar con el prestador'
          check /litoral/corrientes/pesca-en-esquina/ 200 'Precio: a consultar'
          # Dates on cards are relative words, never an exact date (owner, 1/11/2026).
          check /litoral/corrientes/pesca-en-esquina/ 200 'precio revisado en los últimos' 'precio consultado el'
          check /llms.txt 200 'se corrigen o se quitan a pedido' 'PRESTADOR-NO-PUBLICO'   # public listings ARE in llms.txt since 1/11/2026; non-public never
          # Special condition: only for an outfitter we work with.
          check /litoral/corrientes/pesca-en-esquina/ 200 'Con Pescamapa: OFERTA-DE-PRUEBA' 'OFERTA-NO-ACORDADA'
          # Two-level cards (29/10/2026): the agreement badge shows only with consent + state 'acuerdo'; the guide form asks the country.
          check /litoral/corrientes/pesca-en-esquina/ 200 'Operador con acuerdo con Pescamapa'
          check /litoral/corrientes/pesca-en-esquina/ 200 'name="pais"'
          check /llms.txt 200 'Prestadores con condición especial por Pescamapa'
          # Languages and accessibility on the card ("no" is never shown).
          check /litoral/corrientes/pesca-en-esquina/ 200 'Portugués · Inglés'
          check /litoral/corrientes/pesca-en-esquina/ 200 '♿ Ofrece servicio accesible'
          check / 200 'hero-map' 'Primera guía'
          check /llms.txt 200 'OFERTA-DE-PRUEBA' 'OFERTA-NO-ACORDADA'
          # Example-data outfitters never reach visitors.
          check /litoral/corrientes/pesca-en-esquina/ 200 'pacú' 'Don Joaquín River Lodge'
          check /entrevistas/ 200 'Persona Prueba' 'Sin permiso'
          check /en/interviews/ 200 'v-entrevistas'
          check /entrevistas/prueba-el-rio-manda/ 200 '"Article"'
          check /entrevistas/sin-permiso/ 404
          check /wp-sitemap.xml 200 'pm_entrevista'
          check /calendario-de-pesca/ 200 'v-calendario' 'PENDIENTE'
          check /calendario-de-pesca/ 200 'id="esquina"' 'CONTACTO-INTERNO-123'
          check /calendario-de-pesca/ 200 '"FAQPage"'
          check /en/fishing-calendar/ 200 'What you can fish each month'
          check /pt/calendario-de-pesca/ 200 'hreflang="x-default"'
          check /para-guias-y-lodges/ 200 'v-paraguias'
          check /para-guias-y-lodges/ 200 'name="pm_tipo" value="prestador"'
          check /en/for-guides-and-lodges/ 200 'Add your listing'
          check / 200 'para-guias-y-lodges'
          check /llms.txt 200 'Qué se pesca cada mes y qué está vedado'
          check /llms.txt 200 'Para guías y lodges: sumar o reclamar una ficha'
          check /wp-sitemap-vistas-1.xml 200 'calendario-de-pesca'
          check / 200 'Cuándo ir, qué dice el reglamento y con quién pescar'
          check /litoral/corrientes/pesca-en-esquina/ 200 'Mosca (flycast)' 'flycast) (flycast'
          check /robots.txt 200 'Sitemap'
          check /llms.txt 200 'pesca-en-esquina'
          check /llms.txt 200 'prueba-el-rio-manda' 'sin-permiso'
          check /llms.txt 200 'nota-de-prueba'
          check /llms.txt 200 'pesca-en-paso-de-la-patria'
          # Third guide: rules from the official annex, no internal notes, outfitters labelled.
          check /litoral/corrientes/pesca-en-paso-de-la-patria/ 200 'Disposición 853/22' 'PENDIENTE'
          check /litoral/corrientes/pesca-en-paso-de-la-patria/ 200 'un solo ejemplar por embarcación'
          check /litoral/corrientes/pesca-en-paso-de-la-patria/ 200 'Posada del Paso'
          check /litoral/corrientes/pesca-en-paso-de-la-patria/ 200 'sin verificar con el prestador'
          check /litoral/corrientes/pesca-en-paso-de-la-patria/ 200 'TouristDestination'
          check /pt/litoral/corrientes/pesca-em-paso-de-la-patria/ 200 'Disposição 853/22' 'PENDIENTE'
          check /litoral/corrientes/pesca-en-esquina/ 200 '¿Qué tallas y cupos rigen en Corrientes?'
          check /litoral/corrientes/pesca-en-esquina/ 200 'Fuentes consultadas ('
          check /litoral/corrientes/pesca-en-esquina/ 200 '"citation"'
          check /litoral/corrientes/pesca-en-esquina/ 200 'rel="sponsored noopener"'
          check /litoral/corrientes/pesca-en-esquina/ 200 'MAS-GRATIS'
          check /paquetes-de-pesca/esquina/ 200 'v-paquetes' 'PENDIENTE'
          check /paquetes-de-pesca/esquina/ 200 'Pedir cotización de esta opción'
          check /paquetes-de-pesca/esquina/ 200 'consulta--boutique'
          check /paquetes-de-pesca/esquina/ 200 'INTRO-DE-PRUEBA'
          check /paquetes-de-pesca/esquina/ 200 'content="DESC-DE-PRUEBA"'
          check /paquetes-de-pesca/esquina/ 200 'Pedir mi cotización'
          check /paquetes-de-pesca/esquina/ 200 'barra-pedir'
          # City page (1/11/2026): every public outfitter of the destination, short answer, FAQ, agreements first; no contact data, no example data.
          check /guias-de-pesca/esquina/ 200 'v-guias' 'CONTACTO-INTERNO-123'
          check /guias-de-pesca/esquina/ 200 'Guías de pesca en Esquina'
          check /guias-de-pesca/esquina/ 200 'PRESTADOR-CON-ACUERDO' 'PRESTADOR-NO-PUBLICO'
          check /guias-de-pesca/esquina/ 200 'PRESTADOR-PUBLICO' 'Don Joaquín River Lodge'
          check /guias-de-pesca/esquina/ 200 '"CollectionPage"'
          check /guias-de-pesca/esquina/ 200 '"LocalBusiness"'
          check /guias-de-pesca/esquina/ 200 'consulta--boutique'
          check /guias-de-pesca/esquina/ 200 'hreflang="es"'   # x-default appears only with a second language; the test has Esquina in Spanish only
          check /en/fishing-guides/esquina/ 404   # the test has no English Esquina guide: no city page in that language
          check /guias-de-pesca/no-existe/ 404
          check /litoral/corrientes/pesca-en-esquina/ 200 '/guias-de-pesca/esquina/'
          check /llms.txt 200 'Guías de pesca por ciudad' 'CONTACTO-INTERNO-123'
          check /llms.txt 200 'guias-de-pesca/esquina/#prestador-' 'PRESTADOR-NO-PUBLICO'
          check /robots.txt 200 'User-agent: GPTBot'
          check /robots.txt 200 'User-agent: ClaudeBot'
          check /wp-sitemap-vistas-1.xml 200 'guias-de-pesca/esquina'
          check /litoral/corrientes/pesca-en-esquina/ 200 'id="consulta"' 'consulta--boutique'
          check /paquetes-de-pesca/esquina/ 200 'Preguntas frecuentes sobre los paquetes de pesca en Esquina'
          check /paquetes-de-pesca/esquina/ 200 '"@type":"FAQPage"'
          check /paquetes-de-pesca/esquina/ 200 '"@type":"WebPage"'
          check /paquetes-de-pesca/esquina/ 200 'rel="canonical"'
          check /paquetes-de-pesca/esquina/ 200 'rel="alternate" hreflang="es"'
          check /paquetes-de-pesca/esquina/ 200 'Paquetes de pesca en Esquina: opciones y precios | Pescamapa'
          check /paquetes-de-pesca/esquina/ 200 'Actualizado el'
          check /especies/dorado/ 200 'Paquetes de pesca en Esquina'
          check /paquetes-de-pesca/esquina/ 200 'Antes de viajar' 'BLOQUE-SIN-TITULO'
          check /paquetes-de-pesca/esquina/ 200 'Segundo párrafo de prueba'
          check /paquetes-de-pesca/esquina/ 200 'href="https://example.com/info"'
          check /paquetes-de-pesca/esquina/ 200 'consultada el 28 de octubre de 2026'
          check /paquetes-de-pesca/esquina/ 200 'Desde \$ 150.000 por lancha'
          check /paquetes-de-pesca/esquina/ 200 'Precio de referencia al 28 de octubre de 2026'
          check /paquetes-de-pesca/esquina/ 200 'Precio: lo cotizamos' 'PAQUETE-OCULTO'
          check /paquetes-de-pesca/esquina/ 200 'application/ld+json' 'INTERNO-NO-PUBLICO'
          n=$(curl -sS "$URL/paquetes-de-pesca/esquina/" | grep -o 'Desde &#036; \|Desde \$ ' | wc -l); [[ "$n" == 1 ]] || { echo "✖ debía haber un solo precio (el sin fecha no se muestra): $n"; fail=1; }
          check /paquetes-de-pesca/goya/ 404
          check /en/fishing-packages/esquina/ 404
          check /litoral/corrientes/pesca-en-esquina/ 200 'paquetes-de-pesca/esquina'
          check /wp-sitemap-vistas-1.xml 200 'paquetes-de-pesca/esquina'
          check /llms.txt 200 'Paquetes de pesca en Esquina'
          check /notas/ 200 'Nota de prueba'
          check /en/notes/ 200 'v-notas'
          check /notas/nota-de-prueba/ 200 'DATO-CLAVE-DE-PRUEBA' 'dato sin confirmar'
          check /notas/nota-de-prueba/ 200 'FUENTE-DE-PRUEBA'
          check /notas/nota-de-prueba/ 200 '"citation"'
          check / 200 '/notas/'
          check /llms.txt 200 'Pescamapa reúne todo lo que necesitás' 'CONTACTO-INTERNO-123'
          # Inquiry through the real form (pm_t in the past: passes the timing check).
          loc=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' \
            -d action=pm_consulta -d pm_tipo=viaje -d pm_idioma=es -d pm_destino=esquina \
            -d pm_volver="$URL/litoral/corrientes/pesca-en-esquina/" -d pm_t=$(( $(date +%s) - 60 )) \
