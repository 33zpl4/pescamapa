          python3 - <<'PY'
          import re, datetime
          s = open('/tmp/pm-rio.json').read()
          fechas = sorted(set(re.findall(r'\d{4}-\d{2}-\d{2}', s)))
          delta = (datetime.date.today() - datetime.timedelta(days=1)) - datetime.date.fromisoformat(fechas[-1])
          s = re.sub(r'\d{4}-\d{2}-\d{2}', lambda m: (datetime.date.fromisoformat(m.group(0)) + delta).isoformat(), s)
          open('/tmp/pm-rio.json', 'w').write(s)
          print('fechas del ejemplo corridas', delta.days, 'días')
          PY
