          # Province hub + species guides block
          check /litoral/corrientes/ 200 'v-provincia' 'PENDIENTE'
          check /litoral/corrientes/ 200 '"CollectionPage"' 'CONTACTO-INTERNO-123'
          check /litoral/corrientes/ 200 'pesca-en-esquina'
          check /en/litoral/corrientes/ 200 'Fishing in Corrientes'
          check /pt/litoral/corrientes/ 200 'hreflang="x-default"'
