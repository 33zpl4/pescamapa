          pique() { # lat lon especie resultado → body
            curl -sS -d action=pm_pique -d pm_t=$(( $(date +%s) - 60 )) -d celda_lat="$1" -d celda_lon="$2" -d especie="$3" -d resultado="$4" -d dia=$(date +%Y%m%d) "$URL/wp-admin/admin-post.php"
          }
          r=$(pique -2784 -5812 dorado bueno)
          [[ "$r" == *'"ok":true'* ]] && echo "✓ reporte de pique guardado" || { echo "✖ reporte: $r"; fail=1; }
          r=$(pique -2784 -5812 dorado bueno)   # same sender, cell, species and day: counted once
          r=$(pique 0 0 dorado bueno)
          [[ "$r" == *'"ok":false'* ]] && echo "✓ celda fuera de la Argentina rechazada" || { echo "✖ celda inválida aceptada: $r"; fail=1; }
          r=$(pique -2784 -5812 ballena bueno)
          [[ "$r" == *'"ok":false'* ]] && echo "✓ especie inválida rechazada" || { echo "✖ especie inválida aceptada: $r"; fail=1; }
          curl -sS -o /dev/null -d action=pm_pique -d pm_web=spam -d pm_t=1 -d celda_lat=-2785 -d celda_lon=-5813 -d especie=surubi -d resultado=bueno -d dia=$(date +%Y%m%d) "$URL/wp-admin/admin-post.php"
          n=$(wp --path="$WP" post list --post_type=pm_reporte --post_status=private --format=count)
          [[ "$n" == 1 ]] && echo "✓ 1 reporte (duplicado, inválidos y bot descartados)" || { echo "✖ reportes guardados: $n (esperado 1)"; fail=1; }
          # Privacy: only the cell is stored, never a point; no name.
          keys=$(wp --path="$WP" eval '$id = get_posts( [ "post_type" => "pm_reporte", "post_status" => "private", "fields" => "ids" ] )[0]; echo implode( ",", array_keys( array_filter( get_post_meta( $id ), fn( $k ) => 0 !== strpos( $k, "_" ), ARRAY_FILTER_USE_KEY ) ) );')
          [[ "$keys" == "celda,celda_lat,celda_lon,especie,resultado,dia,huella" ]] && echo "✓ solo se guarda la celda ($keys)" || { echo "✖ campos guardados: $keys"; fail=1; }
          # The 48 h delay: a fresh report is not on the public page.
          check /pique/ 200 'Todavía no hay reportes'
          wp --path="$WP" eval '$id = get_posts( [ "post_type" => "pm_reporte", "post_status" => "private", "fields" => "ids" ] )[0]; wp_update_post( [ "ID" => $id, "post_date" => gmdate( "Y-m-d H:i:s", time() - 3 * DAY_IN_SECONDS ), "post_date_gmt" => gmdate( "Y-m-d H:i:s", time() - 3 * DAY_IN_SECONDS ), "edit_date" => true ] ); delete_transient( "pm_pique_celdas" );'
          check /pique/ 200 '1 reporte en 1 zona' 'Todavía no hay reportes'
          check /pique/ 200 '&quot;bueno&quot;:1' 'huella'
          # Hourly limit per sender.
          limite=0; for i in 1 2 3 4 5 6 7; do r=$(pique -2784 -5812 surubi regular); [[ "$r" == *limite* ]] && limite=1; done
          [[ "$limite" == 1 ]] && echo "✓ límite por hora" || { echo "✖ no hubo límite por hora"; fail=1; }
          if [[ -f "$WP/wp-content/debug.log" ]]; then
            echo "== debug.log"; cat "$WP/wp-content/debug.log"
            grep -qE 'PHP (Fatal|Warning|Parse)' "$WP/wp-content/debug.log" && { echo "✖ errores PHP"; fail=1; }
          fi
          exit $fail

      - name: Editor can replace a guide's photo and save (no blocking validation)
        run: |
          w() { wp --path="$WP" "$@"; }
          curl -s -o /dev/null "$URL/" || { wp --path="$WP" server --host=localhost --port=8080 > /tmp/server.log 2>&1 & sleep 3; }
          w user create cheyenne cheyenne@example.com --role=pescamapa_editor --user_pass=prueba-123 --quiet
          post=$(w post list --post_type=pm_destino --meta_key=clave --meta_value=esquina --format=ids)
          php -r '$i = imagecreatetruecolor( 1600, 1000 ); imagefill( $i, 0, 0, imagecolorallocate( $i, 30, 80, 60 ) ); imagejpeg( $i, "/tmp/nueva.jpg" );'
          foto=$(w media import /tmp/nueva.jpg --porcelain)
          dump() { w eval 'foreach ( [ "fuentes", "faqs", "aguas", "temporada" ] as $n ) { $c = get_post_meta( '"$post"', $n, true ); $v = get_post_meta( '"$post"', $n . "_0_" . ( "fuentes" === $n ? "nombre" : ( "faqs" === $n ? "pregunta" : ( "aguas" === $n ? "nombre" : "meses" ) ) ), true ); echo "$n: filas=" . var_export( $c, true ) . " primera=" . var_export( $v, true ) . "\n"; }'; }
          echo "== repetidores ANTES"; dump
          echo "== formulario en el servidor (admin vs editora)"; POST_ID="$post" w eval-file "$GITHUB_WORKSPACE/.github/scripts/formulario.php"
          fuente_antes=$(w post meta get "$post" fuentes_0_nombre || true)
          [[ -n "$fuente_antes" ]] || { echo "✖ la guía de prueba no tiene fuentes cargadas"; exit 1; }
          w eval "update_field( 'foto_autor', 'Tomás Prueba', $foto );"
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > editor.mjs <<'JS'
          import { chromium } from 'playwright';
          const [url, post, foto] = process.argv.slice(2);
          const b = await chromium.launch();
          const p = await b.newPage();
          await p.goto(`${url}/wp-login.php`);
          await p.fill('#user_login', 'cheyenne');
          await p.fill('#user_pass', 'prueba-123');
          await Promise.all([p.waitForNavigation(), p.click('#wp-submit')]);
          await p.goto(`${url}/wp-admin/post.php?post=${post}&action=edit`);
          await p.waitForFunction(() => window.wp?.data?.select('core/editor')?.getCurrentPostId());
          await p.evaluate((f) => {
            wp.data.dispatch('core/preferences')?.set('core/edit-post', 'welcomeGuide', false);
            wp.data.dispatch('core/editor').editPost({ featured_media: Number(f) });
          }, foto);
          const campos = await p.$$eval('[name^="acf[field_pm_d_fuentes]"]', (els) => els.slice(0, 10).map((e) => `${e.name}=${JSON.stringify(e.value)} type=${e.type} visible=${!!(e.offsetWidth || e.offsetHeight)}`));
          console.log('inputs de fuentes en el formulario:', campos.length, '\n' + campos.join('\n'));
          const otros = await p.$$eval('[name^="acf[field_pm_d_faqs]"]', (els) => els.slice(0, 3).map((e) => `${e.name}=${JSON.stringify(e.value).slice(0, 40)}`));
          console.log('inputs de faqs (comparación):\n' + otros.join('\n'));
          await p.keyboard.press('Escape');
          await p.locator('.editor-post-publish-button, .editor-post-publish-button__button').first().click();
          await p.waitForTimeout(6000);
          const texto = await p.locator('body').innerText();
          const errores = await p.locator('.acf-error-message, .acf-notice.-error, .acf-admin-notice.-error').allInnerTexts();
          console.log('avisos ACF:', JSON.stringify(errores));
          await p.screenshot({ path: '/tmp/pw/editor.png', fullPage: false });
          await b.close();
          if (/Validation failed|requieren atención|requiere atención/i.test(texto + errores.join(' '))) { console.log('✖ la validación bloqueó el guardado'); process.exit(1); }
          JS
          sed -i 's/^          //' editor.mjs
          node editor.mjs "$URL" "$post" "$foto"
          w eval-file "$GITHUB_WORKSPACE/wordpress/scripts/revisar-fotos.php" | head -20   # monthly photo report runs clean
          echo "== repetidores DESPUÉS"; dump
          fuente_despues=$(w post meta get "$post" fuentes_0_nombre || true)
          [[ "$fuente_despues" == "$fuente_antes" ]] && echo "✓ guardar desde el panel no borra las fuentes" || { echo "✖ las fuentes cambiaron al guardar: '$fuente_antes' → '$fuente_despues'"; exit 1; }
          got=$(w post meta get "$post" _thumbnail_id)
          [[ "$got" == "$foto" ]] && echo "✓ el editor reemplazó la foto y guardó" || { echo "✖ foto destacada = $got (esperado $foto)"; exit 1; }
      - uses: actions/upload-artifact@v4
