name: Verify live site

# Rule (owner, 27/10/2026): this check must not fail because an editor changed content (a title, a photo credit, a price).
# It asserts what the code and the scripts guarantee: pages exist, templates render, JSON-LD, no internal markers,
# no leaked contact data. Wording that editors own is not asserted.
# Read-only check of what pescamapa.com serves (WordPress since the domain
# switch): pages in every language, www redirect, sitemap, guides indexable
# with no internal PENDIENTE notes shown,
# JSON-LD and hreflang on the guides, and the build stamp being served.
# Manual (after a deploy) and weekly. No push trigger: it ran before the deploy finished and failed (and emailed).

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SITE: https://pescamapa.com
    steps:
      - name: DNS
        run: |
          echo "== NS";  dig +short NS pescamapa.com
          echo "== A";   dig +short A pescamapa.com
          echo "== www"; dig +short AAAA www.pescamapa.com

      - name: Served pages
        run: |
          fail=0
          check() { # path expected-status [must-contain] [must-not-contain]
            code=$(curl -sS -m 30 -o page.html -w '%{http_code}' "$SITE$1")
            if [[ "$code" != "$2" ]]; then echo "✖ $code $1 (esperado $2)"; fail=1; return; fi
            if [[ -n "${3:-}" ]] && ! grep -q -- "$3" page.html; then echo "✖ $1 no contiene: $3"; fail=1; return; fi
            if [[ -n "${4:-}" ]] && grep -q -- "$4" page.html; then echo "✖ $1 contiene: $4"; fail=1; return; fi
            echo "✓ $code $1"
          }
          check / 200 'PESCAMAPA'
          echo "   build servido: $(grep -o 'data-build="[^"]*"' page.html | head -1)"
          grep -qE "name=[\"']robots[\"'][^>]*noindex" page.html && { echo "✖ la portada tiene noindex (¿blog_public = 0?)"; fail=1; }
          check /pt/ 200 'lang="pt-BR"'
          check /en/ 200 'lang="en"'
          check /mapa/ 200 'class="mapa"'
          check /en/map/ 200 'class="mapa"'
          check /pique/ 200 'pique-mapa'
          check /armar-viaje/ 200 'name="contacto"'
          check / 200 'armar-viaje'
          # Terms of use and privacy policy, 3 languages; linked from the footer and the forms.
          check /terminos/ 200 'Términos de uso'
          check /terminos/ 200 'Las fotos pueden estar recortadas'
          check /privacidad/ 200 'Política de privacidad'
          check /privacidad/ 200 'Quién trata tus datos'   # (el email sale ofuscado por Cloudflare: no se busca el texto)
          check /en/terms/ 200 'Terms of use'
          check /en/privacy/ 200 'Privacy policy'
          check /pt/termos/ 200 'Termos de uso'
          check /pt/privacidade/ 200 'Política de privacidade'
          check / 200 '/privacidad/'
          check /armar-viaje/ 200 'política de privacidad'
          check / 200 'Cheyenne Justiniano</span> y <span>Alberto Ayala'
          # River conditions (daily workflow rio.yml): the hub, one point page per station, the block in a guide.
          for p in /altura-del-rio/ /en/river-levels/ /pt/altura-do-rio/; do
            check "$p" 200 'class="tabla-rio"'
            grep -q 'application/ld+json' page.html || { echo "✖ $p sin JSON-LD"; fail=1; }
          done
          check /altura-del-rio/zarate/ 200 'class="rio-num"'
          check /altura-del-rio/inventado/ 404
          check / 200 '/altura-del-rio/'
          # Long-form notes (dorado, surubí, trucha) in 3 languages. Only what the code guarantees: the page exists,
          # JSON-LD, a title with the brand, a cover photo with a credit, no leftover internal markers. NOT the wording
          # of titles, boxes or photographers' names: editors own those and may change them.
          for p in /notas/cuando-pescar-dorado/ /en/notes/best-time-to-fish-golden-dorado/ /pt/notas/quando-pescar-dourado/ \
                   /notas/cuando-pescar-surubi/ /en/notes/best-time-to-fish-surubi/ /pt/notas/quando-pescar-surubi/ \
                   /notas/cuando-pescar-trucha-patagonia/ /en/notes/best-time-to-fish-trout-patagonia/ /pt/notas/quando-pescar-truta-patagonia/; do
            check "$p" 200 'application/ld+json' 'PENDIENTE'
            grep -q '<title>[^<]*Pescamapa' page.html || { echo "✖ $p sin título con la marca"; fail=1; }
          done
          for p in /notas/cuando-pescar-dorado/ /notas/cuando-pescar-surubi/ /notas/cuando-pescar-trucha-patagonia/; do
            check "$p" 200 '<figcaption>'   # the cover photo shows its credit (whoever the editor named)
          done
          check /notas/ 200 'cuando-pescar-surubi'
          # Notes inside the guides, the species pages and the home.
          check /litoral/corrientes/pesca-en-goya/ 200 'Para leer antes de ir a Goya'
          check /litoral/corrientes/pesca-en-goya/ 200 'cuando-pescar-surubi'
          check /especies/dorado/ 200 'Notas sobre esta especie'
          check /especies/ 200 'v-especies' 'PENDIENTE'
          check /especies/ 200 '/especies/pejerrey/'
          check /en/species/ 200 'v-especies'
          check /pt/especies/ 200 'v-especies'
          check /especies/trucha/ 200 'cuando-pescar-trucha-patagonia'
          check / 200 'Ver todas las notas'
          check /en/ 200 'See all notes'
          check /llms.txt 200 'cuando-pescar-dorado'
          # Species pages: exist, JSON-LD, nothing internal showing (the facts in them are the editors' to change).
          for p in /especies/dorado/ /en/species/dorado/ /pt/especies/dorado/ /especies/surubi/ /especies/trucha/ /en/species/trucha/ /pt/especies/trucha/; do
            check "$p" 200 'application/ld+json' 'PENDIENTE'
          done
          check /en/plan-your-trip/ 200 'name="contacto"'
          check /pt/planejar-viagem/ 200 'name="contacto"'
          check /en/bite-zones/ 200 'pique-mapa'
          check /creditos/ 301
          check /entrevistas/ 200 'v-entrevistas'
          check /en/interviews/ 200 'v-entrevistas'
          check /robots.txt 200 'Sitemap'
          check /llms.txt 200 'Pescamapa reúne todo lo que necesitás'
          grep -q 'pesca-en-goya' page.html || { echo "✖ llms.txt no lista Goya"; fail=1; }
          check /wp-sitemap.xml 200 'vistas'
          check /esto-no-existe/ 404
          for p in /litoral/corrientes/pesca-en-goya/ /pt/litoral/corrientes/pesca-em-goya/ /en/litoral/corrientes/fishing-in-goya/; do
            check "$p" 200 'TouristDestination'
            grep -q 'hreflang="x-default"' page.html || { echo "✖ $p sin hreflang"; fail=1; }
            grep -qE "name=[\"']robots[\"'][^>]*noindex" page.html && { echo "✖ $p tiene noindex"; fail=1; }
            grep -q 'PENDIENTE' page.html && { echo "✖ $p muestra una nota PENDIENTE"; fail=1; }
            grep -q 'admin-post.php' page.html || { echo "✖ $p sin formulario de consulta"; fail=1; }
          done
          for p in /litoral/corrientes/pesca-en-paso-de-la-patria/ /pt/litoral/corrientes/pesca-em-paso-de-la-patria/; do
            check "$p" 200 'TouristDestination'
            grep -qE "name=[\"']robots[\"'][^>]*noindex" page.html && { echo "✖ $p tiene noindex"; fail=1; }
            grep -q 'PENDIENTE' page.html && { echo "✖ $p muestra una nota PENDIENTE"; fail=1; }
          done
          # La Paz (Entre Ríos): licence fees from the Dirección de Entre Ríos, honest "not confirmed" for sizes.
          for p in /litoral/entre-rios/pesca-en-la-paz/ /pt/litoral/entre-rios/pesca-em-la-paz/; do
            check "$p" 200 'TouristDestination'
            grep -qE "name=[\"']robots[\"'][^>]*noindex" page.html && { echo "✖ $p tiene noindex"; fail=1; }
            grep -q 'PENDIENTE' page.html && { echo "✖ $p muestra una nota PENDIENTE"; fail=1; }
          done
          # San Martín y Junín de los Andes (Neuquén): season opens 1 November; 2025-2026 reference fees from the regulation, no per-water rules.
          for p in /patagonia/neuquen/pesca-san-martin-junin-de-los-andes/ /en/patagonia/neuquen/fishing-san-martin-junin-de-los-andes/; do
            check "$p" 200 'TouristDestination'
            grep -qE "name=[\"']robots[\"'][^>]*noindex" page.html && { echo "✖ $p tiene noindex"; fail=1; }
            grep -q 'PENDIENTE' page.html && { echo "✖ $p muestra una nota PENDIENTE"; fail=1; }
            grep -q 'cazaypesca.neuquen.gob.ar' page.html || { echo "✖ $p sin el enlace al permiso de Neuquén"; fail=1; }
            grep -q 'reglamentodepesca.org.ar' page.html || { echo "✖ $p sin el enlace al reglamento patagónico"; fail=1; }
          done
          # Chascomús (Buenos Aires): licence from the Ministry, veda 1/9-30/11, 25 cm; no bag limit or fees published.
          for p in /pampa/buenos-aires/pesca-chascomus/ /en/pampa/buenos-aires/fishing-chascomus/; do
            check "$p" 200 'TouristDestination'
            grep -qE "name=[\"']robots[\"'][^>]*noindex" page.html && { echo "✖ $p tiene noindex"; fail=1; }
            grep -q 'PENDIENTE' page.html && { echo "✖ $p muestra una nota PENDIENTE"; fail=1; }
            grep -q 'desarrollo_agrario/DAPA/vedas' page.html || { echo "✖ $p sin el enlace a la página de vedas"; fail=1; }
            grep -q '25 cm' page.html || { echo "✖ $p sin la talla mínima"; fail=1; }
          done
          # The sample WordPress pages stay unpublished.
          for p in /hola-mundo/ /pagina-ejemplo/; do check "$p" 404; done
          check /litoral/corrientes/pesca-en-goya/ 200 'Más para hacer'
          # Provider cards show up and never leak the internal contact data (phones, handles).
          check /litoral/corrientes/pesca-en-goya/ 200 'class="prestador' '3777'
          check /litoral/corrientes/pesca-en-goya/ 200 'class="prestador' '603774'
          check /litoral/corrientes/pesca-en-goya/ 200 'class="miniaturas"' 'tomasfraa'
          # Esquina exists once esquina-2026-10-20 ran (Spanish first).
          code=$(curl -sS -m 30 -o page.html -w '%{http_code}' "$SITE/litoral/corrientes/pesca-en-esquina/")
          if [[ "$code" == 200 ]]; then
            grep -q 'PENDIENTE' page.html && { echo "✖ Esquina muestra una nota PENDIENTE"; fail=1; } || echo "✓ 200 Esquina"
          else echo "· Esquina: $code (¿falta correr el script?)"; fi
          loc=$(curl -sS -m 30 -o /dev/null -w '%{http_code} %{redirect_url}' "https://www.pescamapa.com/mapa/")
          if [[ "$loc" =~ ^30[178]\ https://pescamapa\.com/mapa/ ]]; then echo "✓ www → $loc"; else echo "✖ www redirect: $loc"; fail=1; fi
          exit $fail
