name: Probe river data
# Read-only probe (20/11/2026). 1) INA a5 API: catalogue entries (alert / evacuation levels) and which series exist, forecasts included,
# for the Paraná stations; 2) the INA daily report PDF (Perspectiva column); 3) official pages that may publish outlooks or notices
# (INA, Prefectura, Yacyretá, Itaipú, Goya, Corrientes). Prints short extracts only; phone numbers and e-mails are scrubbed.
# No secrets, nothing is written anywhere. Manual only.
on: workflow_dispatch
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Install pdftotext
        run: sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1; pdftotext -v 2>&1 | head -1
      - uses: actions/checkout@v4
      - name: Probe
        run: python3 -u .github/scripts/sonda-rio.py
