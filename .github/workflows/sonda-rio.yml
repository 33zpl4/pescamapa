name: Probe river data

# Read-only probe: which INA a5 stations exist around Buenos Aires (Río de la Plata, Delta, Luján, Salado...)
# and which of them have recent readings. Changes nothing. Run by hand: Actions -> Probe river data.

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Stations around Buenos Aires
        run: |
          set +e
          B=https://alerta.ina.gob.ar/a5
          curl -sS -m 120 -o estaciones.json "$B/obs/puntual/estaciones?format=json"
          curl -sS -m 120 -o series.json "$B/obs/puntual/series?format=json"
          python3 - <<'PY'
          import json, re
          est = json.load(open('estaciones.json'))
          ser = json.load(open('series.json')); rows = ser['rows'] if isinstance(ser, dict) else ser
          prov = re.compile(r'buenos aires|capital|caba|autonoma|autónoma', re.I)
          rio = re.compile(r'plata|palmas|luj[aá]n|salado|delta|guaz|matanza|reconquista|samborom|uruguay|paran[aá]', re.I)
          por_est = {}
          for r in rows:
              if (r.get('var') or {}).get('var') == 'H' and (r.get('procedimiento') or {}).get('nombre') == 'medición directa':
                  por_est[r['estacion']['id']] = r
          print('--- provinces seen in stations:', sorted({str(e.get('provincia')) for e in est if prov.search(str(e.get('provincia')))}))
          n = 0
          for e in est:
              if e.get('tipo') != 'H': continue
              if not (prov.search(str(e.get('provincia'))) and rio.search(str(e.get('rio')))): continue
              s = por_est.get(e['id'])
              dr = (s or {}).get('date_range') or {}
              fin = (dr.get('timeend') or '')[:10]
              if fin >= '2026-10-15':
                  n += 1
                  print(e['id'], '|', e['nombre'], '|', e.get('abreviatura'), '|', e.get('rio'), '|', e.get('provincia'), '| alerta', e.get('nivel_alerta'), '| evac', e.get('nivel_evacuacion'), '| red', (e.get('red') or {}).get('nombre'), '| serie', (s or {}).get('id'), '| hasta', fin)
          print('stations with recent readings:', n)
          print('--- Mar del Plata / Chascomús / Samborombón / laguna by name')
          for e in est:
              if re.search(r'mar del plata|chascom|lacombe|monte|laguna|samborom|quequ|bah[ií]a blanca|san clemente', str(e.get('nombre')) + ' ' + str(e.get('localidad')), re.I) and e.get('tipo') == 'H':
                  s = por_est.get(e['id']); dr = (s or {}).get('date_range') or {}
                  print(e['id'], '|', e['nombre'], '|', e.get('rio'), '|', e.get('provincia'), '| hasta', (dr.get('timeend') or '')[:10])
          PY
