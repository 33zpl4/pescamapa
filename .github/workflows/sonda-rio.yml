name: Probe river data
on: workflow_dispatch
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: OpenStreetMap boat ramps (leisure=slipway), read-only
        run: |
          set +e
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, time
          API = "https://overpass-api.de/api/interpreter"
          def q(query):
              for i in range(2):
                  try:
                      req = urllib.request.Request(API, data=urllib.parse.urlencode({"data": query}).encode(), headers={"User-Agent": "pescamapa-sonda/1.0 (+https://pescamapa.com)"})
                      return json.load(urllib.request.urlopen(req, timeout=45))
                  except Exception as e:
                      err = e; time.sleep(3)
              return {"error": str(err)}
          places = {"Goya": (-29.14, -59.26), "Esquina": (-30.01, -59.53), "Paso de la Patria": (-27.32, -58.57), "La Paz ER": (-30.75, -59.64),
                    "Chascomus": (-35.57, -58.01), "Tigre/Delta": (-34.42, -58.58), "San Martin de los Andes": (-40.16, -71.35), "Junin de los Andes": (-39.95, -71.07), "Corrientes": (-27.47, -58.83), "Concordia": (-31.39, -58.02)}
          for n, (la, lo) in places.items():
              d = 0.2
              bb = f"{la-d},{lo-d},{la+d},{lo+d}"
              r = q(f'[out:json][timeout:30];(nwr["leisure"="slipway"]({bb}););out center tags;')
              els = r.get("elements", [])
              print(f"--- {n}: {len(els)} slipways en un cuadro de ~44 km" + (f" ERROR {r['error']}" if "error" in r else ""))
              for e in els[:12]:
                  t = e.get("tags", {})
                  print("   ", e["type"], e["id"], "|", t.get("name"), "|", t.get("access"), "|", t.get("fee"), "|", t.get("surface"), "|", t.get("operator"), "|", t.get("boat"))
              time.sleep(2)
          PY
