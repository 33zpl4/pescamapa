name: Probe river data

# Read-only probe: how does the INA alert site (a5) serve its data, and can we read our stations?
# Prints what it finds; changes nothing. Run by hand: Actions -> Probe river data.

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: INA a5 page - how it calls its API
        run: |
          set +e
          curl -sS -L -m 30 -o p.html "https://alerta.ina.gob.ar/a5/"
          echo "== absolute URLs in the page (not CDNs)"
          grep -o -E "https?://[^\"' )]+" p.html | grep -v -E "cdn|googleapis|highcharts|openlayers|jsdelivr|w3.org|datatables" | sort -u | head -30
          echo "== lines mentioning the API"
          grep -n -E "observaciones|/series|format=json|format=csv|geojson|fetch\(|\\\$\.(get|ajax|getJSON)|url *[:=]|API|api_url|base" p.html | cut -c1-260 | head -70
          echo "== local js files"
          grep -o -E 'src="js/[^"]+"' p.html | sort -u
      - name: INA a5 - try common endpoints
        run: |
          set +e
          for u in \
            "https://alerta.ina.gob.ar/a5/obs/puntual/series?format=json&limit=3" \
            "https://alerta.ina.gob.ar/a5/obs/puntual/estaciones?format=json&limit=3" \
            "https://alerta.ina.gob.ar/a5/obs/puntual/series?format=json&nombre=Goya" \
            "https://alerta.ina.gob.ar/a5/obs/puntual/series" \
            "https://alerta.ina.gob.ar/a5/series" ; do
            echo "== $u"; curl -sS -L -m 40 -o r.txt -w '%{http_code} %{content_type} %{size_download} bytes\n' "$u"; head -c 700 r.txt; echo
          done
      - name: INA daily PDF as text (fallback source)
        run: |
          set +e
          sudo apt-get update -qq >/dev/null 2>&1; sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
          f="reporte_diario_$(date -u +%F).pdf"
          curl -sS -m 60 -o "$f" -w '%{http_code}\n' "https://alerta.ina.gob.ar/ina/06-INFORMES/diario/pdf/$f"
          pdftotext -layout "$f" informe.txt; echo "text chars: $(wc -c < informe.txt)"
          grep -n -i -E 'goya|esquina|la paz|paso de la patria|corrientes|reconquista|concordia|santa fe|ituzaing' informe.txt | head -40
          echo "== first 50 lines"; head -50 informe.txt
