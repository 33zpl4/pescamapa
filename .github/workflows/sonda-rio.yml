name: Probe river data
# Read-only probe (20/11/2026): the official outlook for the Paraná between Corrientes and Santa Fe. Prints (1) the paragraph of
# today's INA daily report PDF about Corrientes-La Paz / Santa Fe-Rosario (and the one of 7 days ago), (2) the INA a5 numeric forecast
# (calibrado 289 tabprono_central: Goya, Corrientes and neighbours, +4 and +11 days, with the probable range). No secrets, nothing is
# written anywhere. Manual only. Sources and findings of 20/11/2026: docs/rio.md, "Proyecciones oficiales".
on: workflow_dispatch
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Install pdftotext
        run: sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1; pdftotext -v 2>&1 | head -1
      - uses: actions/checkout@v4
      - name: Reference values (read-only; 23/11/2026) - prints the BCRA rate and tries the Secretaría de Energía fuel price
        continue-on-error: true
        run: |
          python3 -u wordpress/build/cotizaciones-traer.py /tmp/pm-cotizaciones.json
          cat /tmp/pm-cotizaciones.json
      - name: Probe
        run: python3 -u .github/scripts/sonda-rio.py

