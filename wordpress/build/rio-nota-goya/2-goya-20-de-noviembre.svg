<line x1="1003.8" x2="1003.8" y1="248" y2="702" stroke="#11251f" stroke-width="6"/>
<circle cx="1003.8" cy="248" r="13" fill="#d8e46a" stroke="#11251f" stroke-width="5"/>
<text x="979.8" y="258" font-size="34" font-weight="700" text-anchor="end" fill="#11251f">2026: 5,68 m</text>
<text x="40" y="778" font-size="30" fill="#5f685e">Lectura del 20 de noviembre de 2026. Años de comparación: 1990 a 2025.</text>
<text x="40" y="814" font-size="30" fill="#5f685e">Años de menor y mayor altura media: 2021 y 1998.</text>
<text x="40" y="850" font-size="30" fill="#344a3d">Datos: Instituto Nacional del Agua (escalas de Prefectura Naval Argentina).</text>
<text x="40" y="886" font-size="30" fill="#344a3d">Elaboración: Pescamapa.</text>
</svg>
