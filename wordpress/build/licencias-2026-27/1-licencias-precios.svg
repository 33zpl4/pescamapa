<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d" font-family="Outfit, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Cuánto cuesta pescar en Argentina</title>
<desc id="d">Barras con el valor del permiso de un extranjero no residente en pesos argentinos. Un día: Patagonia $ 50.000; Tierra del Fuego $ 78.000; Santa Cruz $ 90.000. Temporada: Patagonia $ 280.000; Tierra del Fuego $ 260.000; Santa Cruz $ 450.000. Fuera de la comparación: Entre Ríos, 5 días, $ 24.251,60; Corrientes se fija en litros de nafta súper: 16 litros por un día y 36 por seis.</desc>
<rect width="1200" height="900" fill="#fbfaf6"/>
<text x="40" y="58" font-family="'Bebas Neue', Impact, 'Arial Narrow', sans-serif" font-size="34" letter-spacing="2" fill="#5e6b33">PESCAMAPA</text>
<text x="40" y="118" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" fill="#14251f">Cuánto cuesta pescar en Argentina</text>
<text x="40" y="164" font-size="34" fill="#344a3d">Permiso para extranjeros no residentes, 2026/27, en pesos</text>
<text x="40" y="208" font-size="32" font-weight="700" fill="#11251f">Leído entre el 4 y el 18 de noviembre de 2026</text>
<text x="40" y="262" font-family="'Bebas Neue', Impact, 'Arial Narrow', sans-serif" font-size="34" letter-spacing="1.5" fill="#5e6b33">UN DÍA</text>
<text x="40" y="313" font-size="34" font-weight="600" fill="#14251f">Patagonia</text>
<rect x="400" y="284" width="56.0" height="40" fill="#344a3d" stroke="#11251f" stroke-width="2.5"/>
<text x="470.0" y="316" font-size="34" font-weight="700" fill="#11251f">$ 50.000</text>
<text x="40" y="369" font-size="34" font-weight="600" fill="#14251f">Tierra del Fuego</text>
<rect x="400" y="340" width="87.4" height="40" fill="#344a3d" stroke="#11251f" stroke-width="2.5"/>
<text x="501.4" y="372" font-size="34" font-weight="700" fill="#11251f">$ 78.000</text>
<text x="40" y="425" font-size="34" font-weight="600" fill="#14251f">Santa Cruz</text>
<rect x="400" y="396" width="100.8" height="40" fill="#344a3d" stroke="#11251f" stroke-width="2.5"/>
<text x="514.8" y="428" font-size="34" font-weight="700" fill="#11251f">$ 90.000</text>
<text x="40" y="492" font-family="'Bebas Neue', Impact, 'Arial Narrow', sans-serif" font-size="34" letter-spacing="1.5" fill="#5e6b33">TEMPORADA</text>
<text x="40" y="543" font-size="34" font-weight="600" fill="#14251f">Patagonia</text>
<rect x="400" y="514" width="313.6" height="40" fill="#344a3d" stroke="#11251f" stroke-width="2.5"/>
<text x="727.6" y="546" font-size="34" font-weight="700" fill="#11251f">$ 280.000</text>
<text x="40" y="599" font-size="34" font-weight="600" fill="#14251f">Tierra del Fuego</text>
<rect x="400" y="570" width="291.2" height="40" fill="#344a3d" stroke="#11251f" stroke-width="2.5"/>
<text x="705.2" y="602" font-size="34" font-weight="700" fill="#11251f">$ 260.000</text>
<text x="40" y="655" font-size="34" font-weight="600" fill="#14251f">Santa Cruz</text>
<rect x="400" y="626" width="504.0" height="40" fill="#344a3d" stroke="#11251f" stroke-width="2.5"/>
<text x="918.0" y="658" font-size="34" font-weight="700" fill="#11251f">$ 450.000</text>
<line x1="400" x2="400" y1="250" y2="670" stroke="#11251f" stroke-width="3"/>
<rect x="20" y="698" width="1160" height="104" rx="10" fill="#f4f2e9"/>
<text x="40" y="734" font-size="30" fill="#14251f"><tspan font-weight="700">Entre Ríos:</tspan> 5 días, $ 24.251,60 (octubre de 2026)</text>
<text x="40" y="774" font-size="30" fill="#14251f"><tspan font-weight="700">Corrientes:</tspan> 16 litros de nafta súper por un día, 36 por seis</text>
<text x="40" y="844" font-size="30" fill="#344a3d">Entre Ríos (5 días) y Corrientes (litros) quedan fuera de la comparación.</text>
<text x="40" y="880" font-size="30" fill="#344a3d">Fuentes: organismos provinciales (ver nota). Elaboración: Pescamapa.</text>
</svg>
