<title id="t">Goya: 34 días sobre el nivel de alerta</title>
<desc id="d">Altura diaria del río Paraná en Goya del 1 de septiembre al 20 de noviembre de 2026: sube de 2,57 m el 4 de septiembre, cruza el nivel de alerta (5,20 m) el 18 de octubre, el de evacuación (5,70 m) el 29 de octubre, marca 6,10 m del 3 al 5 de noviembre y baja a 5,68 m el 20 de noviembre: 34 días sobre el alerta y 22 sobre el de evacuación. Aparte, el pronóstico del INA emitido el 20 de noviembre: 5,39 m el 24/11 y 5,45 m el 1/12, con rango probable de 5,00 a 5,70 m.</desc>
