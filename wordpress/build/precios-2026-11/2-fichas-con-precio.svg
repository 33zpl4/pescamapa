<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d" font-family="Outfit, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Cuántas fichas publican su precio</title>
<desc id="d">Barras por zona: fichas con precio fechado y sin precio. Corrientes: 4 de 24; Patagonia sur: 4 de 13; Bariloche: 5 de 9; Chubut y Neuquén: 0 de 6; Entre Ríos y Buenos Aires: 0 de 6; Todas las fichas: 13 de 58</desc>
<rect width="1200" height="900" fill="#fbfaf6"/>
<text x="40" y="58" font-family="'Bebas Neue', Impact, 'Arial Narrow', sans-serif" font-size="34" letter-spacing="2" fill="#5e6b33">PESCAMAPA</text>
<text x="40" y="116" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#14251f">Cuántas fichas publican su precio</text>
<text x="40" y="160" font-size="32" fill="#344a3d">Fichas de lugares con precio fechado, por zona</text>
<text x="40" y="204" font-size="34" font-weight="700" fill="#11251f">13 de 58 fichas, a noviembre de 2026</text>
