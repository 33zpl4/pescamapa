  label: Especies — English
  type: collection
  path: src/content/especies/en
  filename: '{fields.clave}.md'
  view:
    fields:
    - nombre
    - estado
    primary: nombre
  fields:
  - name: idioma
    label: Idioma
    type: string
    hidden: true
    default: en
  - name: estado
    label: Estado
    type: select
    required: true
    default: borrador
    options:
      values:
      - borrador
      - publicado
    description: borrador = visible con cartel "en construcción", Google no la indexa · publicado = exige fuente oficial,
      reglamento verificado (fecha) y ninguna línea PENDIENTE; si falta algo, el cambio no se publica.
  - name: nombre
    label: Nombre común
    type: string
    required: true
  - name: clave
    label: Clave (igual en los tres idiomas)
    type: string
    required: true
    description: Solo minúsculas, números y guiones (ej. paso-de-la-patria).
  - name: cientifico
    label: Nombre científico
    type: string
    required: true
  - name: title
    label: Título para Google (máx. 65)
    type: string
    required: true
    options:
      maxlength: 65
  - name: description
    label: Descripción para Google (70 a 160)
    type: text
    required: true
    options:
      minlength: 70
      maxlength: 160
  - name: resumen
    label: Resumen (subtítulo)
    type: text
    required: true
  - name: fuentes
    label: Fuentes
    type: object
    list: true
    fields:
    - name: nombre
      label: Nombre de la fuente
      type: string
      required: true
    - name: url
      label: Enlace
      type: string
      required: true
    - name: oficial
      label: ¿Es oficial (gobierno, municipio, organismo)?
      type: boolean
    - name: consultada
      label: Fecha de consulta
      type: date
      required: true
  - name: actualizado
    label: Última actualización
    type: date
    required: true
  - name: body
    label: Texto
    type: rich-text
