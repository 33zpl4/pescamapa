# Pages CMS (app.pagescms.org): the browser editor for Pescamapa.
# Saving in the editor = a commit to this repo = Cloudflare rebuilds the
# site. The build validates everything (src/content.config.ts): a bad field
# leaves the previous version online instead of breaking the site.
# Field names here must match the schema; see docs/guia-editor.md.
media:
  input: src/assets/fotos
  output: src/assets/fotos
  extensions:
  - jpg
  - jpeg
  - png
  - webp
content:
- name: proximos
  label: Próximos destinos (tarjetas "Próximamente")
  type: collection
  path: src/content/proximos
  filename: '{primary}.md'
  description: 'Ciudades que se anuncian en el inicio y en el mapa antes de tener guía. El nombre del archivo es la clave:
    cuando se publique una guía con la misma clave, esta tarjeta se oculta sola. El nombre de archivo se genera del nombre
    (ej. "paso-de-la-patria").'
  view:
    fields:
    - nombre
    - provincia
    - orden
    primary: nombre
    sort:
    - orden
    - nombre
    default:
      sort: orden
      order: asc
  fields:
  - name: nombre
    label: Nombre (español)
    type: string
    required: true
  - name: nombre_pt
    label: Nombre en portugués (si cambia)
    type: string
  - name: nombre_en
    label: Nombre en inglés (si cambia)
    type: string
  - name: provincia
    label: Provincia
    type: string
    required: true
  - name: region
    label: Región
    type: select
    required: true
    options:
      values: &id001
      - value: litoral
        label: Litoral
      - value: patagonia
        label: Patagonia
      - value: pampa
        label: Pampa y lagunas
      - value: costa
        label: Costa atlántica
      - value: centro-norte
        label: Centro y norte
  - name: agua
    label: Río, lago o zona (español)
    type: string
    required: true
  - name: agua_pt
    label: Río/zona en portugués (si cambia)
    type: string
  - name: agua_en
    label: Río/zona en inglés (si cambia)
    type: string
  - name: especies
    label: Especies y modalidades (etiquetas)
    type: select
    list: true
    options:
      values:
      - value: dorado
        label: Dorado
      - value: surubi
        label: Surubí
      - value: pacu
        label: Pacú
      - value: boga
        label: Boga
      - value: variada
        label: Pesca variada
      - value: trucha
        label: Trucha
      - value: mosca
        label: Mosca
      - value: trucha-marron-anadroma
        label: Trucha marrón anádroma
      - value: pejerrey
        label: Pejerrey
      - value: tararira
        label: Tararira
      - value: mar
        label: Pesca de mar
  - name: lat
    label: Latitud (ej. -27.32)
    type: number
    required: true
    description: Clic derecho en Google Maps sobre la ciudad → el primer número.
  - name: lon
    label: Longitud (ej. -58.57)
    type: number
    required: true
    description: El segundo número.
  - &id002
    name: foto
    label: Foto
    type: image
    description: Subí una foto horizontal (mín. 1200 px de ancho). Las fotos de Wikimedia ya cargadas aparecen como nombre
      corto (ej. goya).
  - &id003
    name: foto_credito
    label: Crédito de la foto
    type: string
    description: 'Obligatorio si subís una foto propia o de un tercero: "Foto: Nombre Apellido". Solo fotos con permiso del
      autor.'
  - name: orden
    label: Orden en la lista (1, 2, 3…)
    type: number
- name: destinos-es
  label: Guías de destino — Español
  type: collection
  path: src/content/destinos/es
  filename: '{fields.clave}.md'
  description: Una guía de destino por archivo. Para traducir, creá el mismo destino en la otra carpeta de idioma con la misma
    "Clave".
  view:
    fields:
    - nombre
    - estado
    - actualizado
    primary: nombre
    sort:
    - nombre
    - actualizado
  fields:
  - name: idioma
    label: Idioma
    type: string
    hidden: true
    default: es
  - name: estado
    label: Estado
    type: select
    required: true
    default: borrador
    options:
      values: &id004
      - value: borrador
        label: Borrador (visible, pero Google no la indexa)
      - value: publicado
        label: Publicado (exige reglamento verificado y cero PENDIENTE)
  - name: nombre
    label: Nombre del lugar
    type: string
    required: true
  - name: clave
    label: Clave (identificador, sin espacios ni tildes)
    type: string
    required: true
    pattern:
      regex: ^[a-z0-9-]+$
      message: 'Solo minúsculas, números y guiones. Ej: paso-de-la-patria'
    description: Igual en los tres idiomas. Si existe un "Próximo destino" con este mismo nombre de archivo, su tarjeta desaparece
      sola.
  - name: slug
    label: Dirección web (final de la URL)
    type: string
    required: true
    pattern:
      regex: ^[a-z0-9-]+$
      message: Solo minúsculas, números y guiones.
    description: 'Ej: pesca-en-esquina. No la cambies una vez publicada.'
  - name: region
    label: Región
    type: select
    required: true
    options:
      values: *id001
  - name: provincia
    label: Provincia (en la URL)
    type: select
    required: true
    options:
      values:
      - value: corrientes
        label: Corrientes
      - value: entre-rios
        label: Entre Ríos
      - value: santa-fe
        label: Santa Fe
      - value: neuquen
        label: Neuquén
      - value: tierra-del-fuego
        label: Tierra del Fuego
      - value: buenos-aires
        label: Buenos Aires
  - *id002
  - *id003
  - name: title
    label: Título para Google (máx. 65 caracteres)
    type: string
    required: true
    pattern:
      regex: ^.{1,65}$
      message: Máximo 65 caracteres
  - name: description
    label: Descripción para Google (70 a 160 caracteres)
    type: text
    required: true
    pattern:
      regex: ^[\s\S]{70,160}$
      message: Entre 70 y 160 caracteres
  - name: h1
    label: Titular de la página
    type: string
    required: true
  - name: bajada
    label: Subtítulo (también va en la tarjeta del inicio)
    type: text
    required: true
  - name: lat
    label: Latitud (ej. -29.14)
    type: number
    required: true
    description: Clic derecho en Google Maps sobre el lugar → el primer número.
  - name: lon
    label: Longitud (ej. -59.26)
    type: number
    required: true
    description: El segundo número.
  - name: especies
    label: Especies
    type: select
    list: true
    required: true
    options:
      values: &id005
      - value: surubi
        label: Surubí
      - value: dorado
        label: Dorado
  - name: modalidades
    label: Modalidades
    type: string
    list: true
    required: true
  - name: epoca
    label: Cuándo ir (una línea)
    type: string
    required: true
  - name: aguas
    label: Aguas (ríos, lagunas, zonas)
    type: object
    list: true
    fields:
    - name: nombre
      label: Nombre
      type: string
      required: true
    - name: nota
      label: Descripción
      type: text
      required: true
    - name: lat
      label: Latitud (opcional; solo zonas generales, nunca un pesquero exacto)
      type: number
    - name: lon
      label: Longitud (opcional)
      type: number
  - name: temporada
    label: Calendario
    type: object
    list: true
    fields:
    - name: meses
      label: Época
      type: string
      required: true
    - name: que
      label: Qué esperar
      type: text
      required: true
  - name: reglamento
    label: Reglamento
    type: object
    fields:
    - name: autoridad
      label: Autoridad
      type: string
      required: true
    - name: url
      label: Enlace oficial
      type: string
    - name: verificado
      label: Fecha en que una persona verificó el reglamento vigente
      type: date
      description: Dejar vacío hasta confirmarlo con la autoridad. Sin esta fecha (o con más de un año) la guía no se puede
        publicar.
    - name: resumen
      label: Resumen
      type: text
      required: true
  - name: faqs
    label: Preguntas frecuentes
    type: object
    list: true
    fields:
    - name: pregunta
      label: Pregunta
      type: string
      required: true
    - name: respuesta
      label: Respuesta
      type: text
      required: true
  - &id006
    name: fuentes
    label: Fuentes
    type: object
    list: true
    fields:
    - name: nombre
      label: Nombre de la fuente
      type: string
      required: true
    - name: url
      label: Enlace
      type: string
      required: true
    - name: oficial
      label: ¿Es oficial (gobierno, municipio, organismo)?
      type: boolean
    - name: consultada
      label: Fecha de consulta
      type: date
      required: true
  - name: actualizado
    label: Última actualización
    type: date
    required: true
  - name: autor
    label: Autor
    type: string
    required: true
    default: Equipo Pescamapa
  - name: body
    label: Texto de la guía
    type: rich-text
    description: Para marcar algo que falta verificar, escribí una línea que empiece con "PENDIENTE:". Mientras haya alguna,
      la guía no se puede publicar.
